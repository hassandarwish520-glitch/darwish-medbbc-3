  <style>
    :root {
      --bg: #0b0f14;
      --panel: #121922;
      --panel-2: #171f2b;

      --muted: #97a6ba;
      --border: #283241;
      --accent: #3b82f6;
      --green: #17803d;

      --red: #8b1e2b;
      --yellow: #fff06a;
      --yellow-text: #1e1b00;
      --shadow: 0 12px 32px rgba(0,0,0,.28);
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, Arial, sans-serif; background: radial-gradient(circle at top, #17202d 0%, var(--bg) 38%); color: var(--text); }
    a { color: inherit; }
    .app { min-height:100vh; display:grid; grid-template-columns: 320px 1fr; }
    .sidebar { background: rgba(10,14,20,.88); border-right:1px solid var(--border); padding: 22px 18px; position: sticky; top:0; height:100vh; overflow:auto; }
    .brand { font-size: 1.25rem; font-weight: 800; margin-bottom: 6px; }
    .sub { color: var(--muted); font-size: .93rem; line-height:1.5; }
    .chips { display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
    .chip { border:1px solid var(--border); background: var(--panel); color: var(--text); border-radius:14px; padding:10px 12px; cursor:pointer; font-weight:700; min-width:54px; text-align:center; }
    .chip.active { background: linear-gradient(180deg,#264163,#1c3150); border-color:#426793; }
    .summary { margin-top:20px; padding:14px; border:1px solid var(--border); background: var(--panel); border-radius:18px; color:var(--muted); font-size:.92rem; line-height:1.6; }
    .main { padding: 24px; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
    .toolbar-left, .toolbar-right { display:flex; align-items:center; gap:10px; }
    .q-badge { background: #161f2c; border:1px solid #334154; min-width:72px; text-align:center; padding:12px 14px; border-radius:16px; font-weight:800; box-shadow: var(--shadow); }
    .icon-btn { background: #131a25; border:1px solid var(--border); color: var(--text); width:46px; height:46px; border-radius:14px; cursor:pointer; font-size:1.1rem; }
    .card { max-width: 980px; margin:0 auto; background: rgba(14,20,29,.92); border:1px solid var(--border); border-radius: 28px; overflow:hidden; box-shadow: var(--shadow); }
    .hero { padding:24px 24px 0; }
    .image-wrap { border-radius: 22px; overflow:hidden; border:1px solid var(--border); background:#fff; }
    .hero img { width:100%; display:block; max-height:430px; object-fit:contain; background:#fff; }
    .content { padding: 26px; }
    .eyebrow { color:#7fb1ff; font-size:.84rem; letter-spacing:.08em; text-transform:uppercase; font-weight:800; }
    h1 { margin:10px 0 8px; font-size:1.65rem; line-height:1.25; }
    .stem { color:var(--text); line-height:1.76; font-size:1rem; }
    .stem p, .stem ul, .stem table { margin: 0 0 16px; }
    .stem ul { padding-left: 22px; }
    table { width:100%; border-collapse: collapse; overflow:hidden; border-radius:16px; border:1px solid var(--border); background:#10161f; }
    th, td { padding:12px 14px; border:1px solid var(--border); text-align:left; }
    th { background:#182231; }
    .options { display:grid; gap:14px; margin-top:22px; }
    .option { width:100%; text-align:left; display:flex; gap:14px; align-items:flex-start; border:1px solid #304056; background: linear-gradient(180deg,#1a2230,#151c27); color:var(--text); border-radius:22px; padding:18px 18px; cursor:pointer; transition:.18s ease; }
    .option:hover { transform: translateY(-1px); border-color:#4e6787; }
    .option .letter { width:30px; height:30px; border-radius:999px; border:2px solid #cfd7e4; display:grid; place-items:center; flex:0 0 auto; margin-top:1px; font-weight:800; font-size:.92rem; }
    .option.selected { border-color:#5b8bd6; box-shadow: inset 0 0 0 1px #5b8bd6; }
    .option.correct { background: linear-gradient(180deg,#218545,#156d36); border-color:#4ed37e; }
    .option.correct .letter { border-color:#b9ffd0; }
    .option.wrong { background: linear-gradient(180deg,#70212e,#5a1621); border-color:#d06d7d; }
    .option.wrong .letter { border-color:#ffd0d6; }
    .controls { display:flex; flex-wrap:wrap; gap:12px; margin-top:22px; }
    .primary, .secondary { border:none; border-radius:16px; padding:14px 18px; font-weight:800; cursor:pointer; }
    .primary { background:#3566d6; color:white; }
    .secondary { background:#1a2230; color:var(--text); border:1px solid var(--border); }
    .feedback { margin-top:18px; padding:14px 16px; border-radius:18px; font-weight:800; display:none; }
    .feedback.show { display:block; }
    .feedback.ok { background: rgba(23,128,61,.18); border:1px solid rgba(78,211,126,.4); color:#bff3d0; }
    .feedback.no { background: rgba(139,30,43,.18); border:1px solid rgba(208,109,125,.4); color:#ffd7de; }
    .explanation { display:none; margin-top:22px; padding:22px; background:#10161f; border:1px solid var(--border); border-radius:22px; line-height:1.75; }
    .explanation.show { display:block; }
    .objective { margin-top:16px; background: var(--yellow); color: var(--yellow-text); padding:14px 16px; border-radius:16px; font-weight:700; }
    .footer-note { margin-top:18px; color:var(--muted); font-size:.9rem; }
    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { position:static; height:auto; }
      .main { padding: 14px; }
      .content { padding:20px; }
      h1 { font-size:1.35rem; }
    }

  <script>
    const questions = [{"id": "19", "title": "Common physical finding in acute MI", "stem": "<p>A 54-year-old man comes to the emergency department after awakening in the middle of the night with substernal chest discomfort, left-sided neck pain, diaphoresis, and shortness of breath. He has type 2 diabetes mellitus, hypertension, and a 30-pack-year smoking history. Which of the following physical findings is most commonly associated with this patient's clinical presentation?</p>", "options": [["A", "A. Ejection-type systolic murmur"], ["B", "B. Fixed splitting of S2"], ["C", "C. Friction rub"], ["D", "D. Pulsus paradoxus"], ["E", "E. Fourth heart sound"]], "correct": "4", "explanation": "Acute myocardial ischemia causes transient left ventricular stiffening and impaired relaxation, making an S4 relatively common during the acute phase of MI."}, {"id": "22", "title": "Asymptomatic severe aortic stenosis with reduced EF", "stem": "<p>A 75-year-old man is being evaluated for a heart murmur. He has no exertional chest pain, shortness of breath, palpitations, fatigue, dizziness, or syncope. Physical examination shows a late-peaking systolic murmur at the right upper sternal border radiating to the carotid artery. Echocardiogram shows severe aortic stenosis with valve area 0.9 cm² and ejection fraction 45%. Which of the following is the most appropriate next step in management of this patient?</p>", "options": [["A", "A. Follow with serial echocardiography"], ["B", "B. Reassure with no additional intervention"], ["C", "C. Recommend aortic valve intervention"], ["D", "D. Recommend cardiac exercise program"], ["E", "E. Recommend medical therapy"]], "correct": "2", "explanation": "Even if asymptomatic, severe aortic stenosis with left ventricular ejection fraction <50% is an indication for valve replacement/intervention. Observation alone is not appropriate."}, {"id": "23", "title": "Asymptomatic severe primary MR with LV dilation", "stem": "<p>A 58-year-old computer engineer is evaluated for a murmur heard during a routine physical. He is asymptomatic. There is a 3/6 holosystolic murmur best heard at the apex. Echocardiogram shows mitral valve prolapse with severe mitral regurgitation. The left ventricle is dilated with ejection fraction of 52%. Which of the following is the most appropriate management of this patient?</p>", "options": [["A", "A. Prescribe an angiotensin receptor blocker"], ["B", "B. Prescribe a beta adrenergic blocker"], ["C", "C. Refer for mitral valve repair"], ["D", "D. Refer to an exercise program"], ["E", "E. Repeat echocardiography in 6 months"]], "correct": "2", "explanation": "This is severe primary mitral regurgitation with LV dilation and early LV dysfunction. These are indications for surgical repair even if the patient is asymptomatic, and repair is preferred when feasible."}, {"id": "30", "title": "Screening test for AAA in older male smoker", "stem": "<p>A 68-year-old man comes to the office for a routine examination. He feels well. He has hypertension well controlled with hydrochlorothiazide and hyperlipidemia well controlled with atorvastatin. His last colonoscopy 5 years ago showed no abnormalities. He received the pneumococcal vaccine 3 years ago. He has an active lifestyle and is an avid hunter and fisherman. He has smoked one pack of cigarettes daily for 50 years. He drinks one glass of wine with dinner five times weekly. He is a retired schoolteacher. Vital signs are within normal limits. Examination shows no abnormalities. Which of the following is the most appropriate screening test at this time?</p>", "options": [["A", "A. Colonoscopy"], ["B", "B. Colonoscopy and measurement of serum prostate-specific antigen concentration"], ["C", "C. Pulmonary function testing"], ["D", "D. Ultrasonography of the abdominal aorta"], ["E", "E. No screening tests are indicated"]], "correct": "3", "explanation": "The USPSTF recommends one-time ultrasonography screening for abdominal aortic aneurysm (AAA) in men aged 65–75 years who have ever smoked. AAAs are typically asymptomatic until rupture, so screening to detect subclinical disease is essential. This patient is a 68-year-old man with a heavy smoking history and meets criteria for AAA screening."}, {"id": "31", "title": "Confirming acute coronary syndrome", "stem": "<p>A 57-year-old woman is brought to the emergency department because of a 3-hour history of increasingly severe discomfort in her chest, shortness of breath, and fatigue. The pain radiates to her lower jaw, teeth, and arms. She has hypertension and no known allergies. Her medications are hydrochlorothiazide and calcium and vitamin D supplementation. Her mother and father have hypertension and had myocardial infarctions at the ages of 62 and 53 years, respectively. The patient is diaphoretic and appears to be in moderate distress. She is 170 cm (5 ft 7 in) tall and weighs 82 kg (180 lb); BMI is 28 kg/m². Her temperature is 36.8°C (98.2°F), pulse is 95/min and regular, respirations are 20/min, and blood pressure is 156/89 mm Hg. Examination shows no jugular venous distention or hepatojugular reflux. No carotid bruits are heard. The lungs are clear to auscultation. On cardiac examination, S1 and S2 are normal; an S4 is heard best at the apex. Abdominal examination shows no abnormalities. ECG shows no abnormalities. Serum measurement of which of the following is most likely to confirm the diagnosis?</p>", "options": [["A", "A. A-natriuretic peptide concentration"], ["B", "B. B-natriuretic peptide concentration"], ["C", "C. Lactate dehydrogenase subtype"], ["D", "D. Serum d-dimer concentration"], ["E", "E. Troponin I concentration"]], "correct": "4", "explanation": "Chest pain radiating to the jaw, teeth, and arms with shortness of breath and fatigue in a hypertensive patient with risk factors strongly suggests acute coronary syndrome. Serum troponin I is >99.9% sensitive for cardiac ischemia and is the test most likely to confirm the diagnosis. ECG may be normal early in the course of ACS, so biomarkers are essential."}, {"id": "32", "title": "Hemodynamic findings in mitral stenosis", "stem": "<p>A 57-year-old man is admitted to the hospital because of a 2-month history of shortness of breath with exertion. He becomes short of breath after walking two level blocks or one flight of stairs. On two occasions during this period, he has awoken during the night with shortness of breath; this symptom resolved after 15 minutes of sitting upright. He has a 3-month history of swelling of his ankles. He has smoked one pack of cigarettes daily for 40 years. On examination, pulse is 92/min and regular, respirations are 16/min, and blood pressure is 135/88 mm Hg. Pulse oximetry on room air shows an oxygen saturation of 92%. Jugular venous pressure is 6 cm H2O. Inspiratory crackles are heard at both lung bases. There is a grade 2/6, low-pitched, diastolic murmur at the apex, which lasts throughout diastole and is loudest immediately prior to S1, and an opening snap after S2. There is pitting edema to the midcalves. Right and left cardiac catheterization is most likely to show which of the following findings?</p>", "options": [["A", "A. ↑ PCWP, ↑ LA pressure, ↑ LVEDP"], ["B", "B. ↑ PCWP, ↑ LA pressure, normal LVEDP"], ["C", "C. ↑ PCWP, normal LA pressure, ↑ LVEDP"], ["D", "D. ↑ PCWP, normal LA pressure, normal LVEDP"], ["E", "E. Normal PCWP, ↑ LA pressure, ↑ LVEDP"], ["F", "F. Normal PCWP, ↑ LA pressure, normal LVEDP"], ["G", "G. Normal PCWP, normal LA pressure, ↑ LVEDP"], ["H", "H. Normal PCWP, normal LA pressure, normal LVEDP"]], "correct": "1", "explanation": "Findings of an opening snap and a low-pitched diastolic rumble at the apex with presyncope, PND, and peripheral edema indicate mitral stenosis with pulmonary congestion. Mitral stenosis raises left atrial pressure, pulmonary vein pressure, and pulmonary capillary wedge pressure, while left ventricular end-diastolic pressure remains normal because the LV itself is unaffected."}, {"id": "33", "title": "Best CV risk reduction in HTN smoker", "stem": "<p>A healthy 42-year-old man with sustained BP of 148/94 mm Hg (repeat 148/92) and lipid panel showing total cholesterol 228, HDL 30, LDL 168, triglycerides 190 mg/dL. He smokes 2 packs/day for 26 years and is uninterested in cessation. Family history is significant for hypertension and early MIs in paternal uncles. BMI 23. Which of the following is the most appropriate intervention to decrease cardiovascular morbidity and mortality?</p>", "options": [["A", "A. Switching from beer to red wine"], ["B", "B. Weight loss"], ["C", "C. Aspirin therapy"], ["D", "D. Lisinopril therapy"], ["E", "E. Nicotine patch therapy"]], "correct": "3", "explanation": "This patient has stage 2 hypertension with mild hyperlipidemia and a heavy smoking history. Hypertension is a major modifiable risk factor for cardiovascular morbidity/mortality. Lisinopril (an ACE inhibitor) is an appropriate first-line antihypertensive therapy and is the intervention most likely to decrease his CV morbidity and mortality. The patient is uninterested in smoking cessation, weight loss is not indicated (BMI 23), aspirin in primary prevention has limited mortality benefit, and switching alcoholic beverages does not reduce CV mortality."}, {"id": "34", "title": "Prinzmetal (vasospastic) angina", "stem": "<p>A previously healthy 27-year-old woman comes to the emergency department 1 hour after a 30-minute episode of shortness of breath, nausea, sweating, and crushing substernal chest pain radiating to her left shoulder; the episode resolved spontaneously. On arrival, she is asymptomatic. Pulse 70/min, BP 110/84 mm Hg. ECG shows normal sinus rhythm. Ten minutes later she develops recurrent symptoms. Pulse 120/min, BP 150/105 mm Hg. A second ECG shows 5-mm ST-segment elevations in leads II, III, and aVF. Symptoms resolve with aspirin and nitroglycerin. Coronary angiography shows no abnormalities. Which of the following is the most likely diagnosis?</p>", "options": [["A", "A. Drug-induced myocardial injury"], ["B", "B. Hypovolemic shock"], ["C", "C. Myocardial infarction"], ["D", "D. Prinzmetal angina"], ["E", "E. Viral myocarditis"]], "correct": "3", "explanation": "Episodic chest pain with transient ST-segment elevation that resolves with nitroglycerin in a patient with normal coronary arteries on angiography is classic for Prinzmetal (vasospastic) angina. Episodes are due to transient coronary vasospasm and may occur at rest in young patients without typical CAD risk factors."}, {"id": "35", "title": "Cholesterol embolization after catheterization", "stem": "<p>A 64-year-old man with a 20-year history of hypertension and a 2-year history of angina pectoris undergoes renal arteriography for possible renal artery stenosis. One day later, there are scattered petechiae below the knees of both legs and purplish discoloration of the left third toe. Which of the following is the most likely cause?</p>", "options": [["A", "A. Acute bacterial endocarditis"], ["B", "B. Arteriolar vasospasm caused by hypertension"], ["C", "C. Atheroemboli from the aorta"], ["D", "D. Paradoxical emboli through a patent foramen ovale"], ["E", "E. Vasculitis from an allergy to contrast material"]], "correct": "2", "explanation": "Petechiae and \"blue toe\" discoloration following catheter instrumentation through the aorta are characteristic of cholesterol embolization syndrome. Mechanical disruption of atherosclerotic plaque during the procedure showers cholesterol crystals into distal small arteries and arterioles, producing livedo reticularis, blue toes, and end-organ damage."}, {"id": "36", "title": "Echocardiography in acute decompensated HF", "stem": "<p>An 82-year-old woman is admitted because of 3 days of worsening dyspnea, orthopnea (needing 3 pillows), and inability to walk. She has hypertension, hyperlipidemia, CHF, and OA. Medications are lisinopril, metoprolol, furosemide, simvastatin, acetaminophen. Pulse 96, RR 24, BP 154/98, SpO2 92%. JVD 6 cm above sternal angle. Crackles over lower halves bilaterally. A grade 3/6 harsh crescendo-decrescendo systolic murmur that decreases with Valsalva is heard best at the upper right sternal border; S2 is soft. PMI sustained at 5th ICS midclavicular line. Pitting edema to mid-shins. CXR: cardiomegaly, small pleural effusions, pulmonary vascular congestion. Echocardiography is most likely to show which of the following abnormalities?</p>", "options": [["A", "A. Aortic stenosis"], ["B", "B. Hypertrophic obstructive cardiomyopathy"], ["C", "C. Mitral regurgitation"], ["D", "D. Patent foramen ovale"], ["E", "E. Ventricular septal defect"]], "correct": "0", "explanation": "A harsh crescendo-decrescendo systolic murmur at the upper right sternal border that decreases with Valsalva (decreased preload reduces flow across a stenotic valve), soft S2, sustained PMI, and signs of left-sided heart failure are classic for severe aortic stenosis. Echocardiography will reveal a calcified, narrowed aortic valve with limited opening, increased gradient, and increased flow velocity."}, {"id": "37", "title": "Acid-base disorder in acute MI with shock", "stem": "<p>A 67-year-old woman is brought to ED with 2-hour history of \"pressure-like\" chest pain and progressive dyspnea at rest. Pain radiates to left arm. 25-y h/o HTN and hyperlipidemia. Meds: HCTZ, simvastatin. Never smoked. T 37.4°C, pulse 122, RR 28, BP 88/56, SpO2 88%. JVP 8 cm above sternal angle. Bilateral crackles halfway up. 1+ leg edema, cool extremities. ECG: sinus tachycardia and 1-mm ST elevations in I, aVL, V2–V5. ABG: pH 7.32, PCO2 28 mm Hg, PO2 60 mm Hg. Which of the following is the most likely cause of this patient's acid-base disorder?</p>", "options": [["A", "A. Circulating endotoxin"], ["B", "B. Inability to acidify the urine"], ["C", "C. Increased serum lactic acid concentration"], ["D", "D. Thrombosis in the right main pulmonary artery"], ["E", "E. Ventilation-perfusion mismatch"]], "correct": "2", "explanation": "This patient has cardiogenic shock complicating an acute anterolateral myocardial infarction. ABG shows metabolic acidosis with respiratory compensation (low pH, low PCO2). The most likely cause of metabolic acidosis in this hemodynamic setting is tissue hypoperfusion leading to anaerobic metabolism and increased serum lactic acid (lactic acidosis)."}, {"id": "38", "title": "Hyponatremia in CHF (ADH excess)", "stem": "<p>A 71-year-old man is admitted for management of CHF secondary to ischemic cardiomyopathy. During the past 10 days, while on vacation with his family, he has had progressive dyspnea and orthopnea. He has a 6-year history of CAD. Medications: furosemide, spironolactone, benazepril, atorvastatin, aspirin. Pulse 110/min. JVD present. Bilateral basilar crackles. S3 and S4 heard. Peripheral edema. Serum: Na 131 mEq/L, glucose 102 mg/dL. Which of the following is the most likely explanation for this patient's serum sodium concentration?</p>", "options": [["A", "A. ADH (vasopressin) excess"], ["B", "B. Adrenal insufficiency"], ["C", "C. Diabetes insipidus"], ["D", "D. Glomerular hyperfiltration"], ["E", "E. Hypothyroidism"], ["F", "F. Primary aldosteronism"], ["G", "G. Sodium deficiency"]], "correct": "0", "explanation": "In decompensated heart failure, decreased effective circulating volume stimulates baroreceptors, leading to non-osmotic ADH release. Excess ADH causes free water retention in the collecting ducts, producing dilutional (hypotonic) hyponatremia and worsening volume overload. There is no specific test apart from clinical evaluation of volume status and serum/urine osmolality."}, {"id": "39", "title": "Antivenin-induced anaphylaxis", "stem": "<p>A 23-year-old man is brought to ED 45 minutes after a rattlesnake bite to the left hand. T 37°C, pulse 114, RR 23, BP 134/76, SpO2 98%. Swelling, discoloration, severe tenderness of the left hand. CroFab antivenin is administered. Fifteen minutes later, the patient becomes obtunded and flushed. T 38°C, pulse 138, RR 35, BP 75/34, SpO2 85%. Which of the following is the most likely diagnosis?</p>", "options": [["A", "A. Acute serum sickness"], ["B", "B. Anaphylaxis"], ["C", "C. Cardiogenic shock"], ["D", "D. Disseminated intravascular coagulation"], ["E", "E. Septic shock"]], "correct": "1", "explanation": "Sudden hemodynamic collapse with hypotension, tachycardia, flushing, and respiratory compromise minutes after antigen (CroFab antivenin) exposure is classic anaphylaxis. Anaphylaxis is a severe type I hypersensitivity reaction caused by allergen exposure, characterized by primary reduction in systemic vascular resistance leading to distributive shock."}, {"id": "40", "title": "Best evidence of acute MI in elevated troponin", "stem": "<p>A 57-year-old woman with a 30-y h/o HTN (lisinopril) and 20-y h/o hypercholesterolemia (atorvastatin) presents 8 hours after a 2-hour episode of dyspnea and substernal chest pain radiating to left shoulder (pain 6/10). Smokes 1 ppd × 40 y. Pulse 90, RR 18, BP 160/92. Bilateral basilar crackles. S4 gallop. Serum troponin I 3.6 ng/mL (N<0.4). CXR: moderate cardiomegaly. ECG: T-wave inversion in anterior and lateral precordial leads. Which of the following findings is the best evidence of an acute myocardial infarction in this patient?</p>", "options": [["A", "A. Cardiomegaly on x-ray of the chest"], ["B", "B. Chest pain pattern"], ["C", "C. Increased serum troponin I concentration"], ["D", "D. Presence of crackles"], ["E", "E. Presence of an S4 gallop"], ["F", "F. T-wave inversion in the anterior and lateral precordial leads on ECG"]], "correct": "2", "explanation": "Although chest pain pattern, ECG changes, S4, crackles, and cardiomegaly all support a cardiac diagnosis, none is specific for acute MI. Serum troponin I is the most specific and sensitive routinely-used biomarker for acute myocardial necrosis and is the BEST evidence of an acute MI. T-wave inversion is nonspecific; crackles and cardiomegaly indicate failure but not necessarily ischemia; S4 indicates diastolic dysfunction."}, {"id": "41", "title": "P2Y12 inhibitor in NSTEMI", "stem": "<p>A 62-year-old man with diet-controlled DM2 and 20-pack-year history. Two hours ago he had burning midline chest pain that lasted 30 minutes. Took aspirin en route. Currently no chest pain. BP 135/80, pulse 82, SpO2 97%, BMI 32. Lungs clear. No murmurs. Symmetric peripheral pulses. ECG: sinus rhythm with T-wave inversions in aVF and III. Cardiac troponin I 2.1 ng/mL (N<0.01). Nonemergency PCI within 24 hours is recommended, but the patient declines. Which of the following therapies is indicated at this time?</p>", "options": [["A", "A. Apixaban"], ["B", "B. Ibuprofen and colchicine"], ["C", "C. Nasal cannula oxygen"], ["D", "D. Nitroglycerin infusion"], ["E", "E. P2Y12 inhibitor"]], "correct": "4", "explanation": "The patient has NSTEMI (elevated troponin without ST elevation). Dual antiplatelet therapy with aspirin (already given) and a P2Y12 inhibitor (clopidogrel, ticagrelor, or prasugrel) is a cornerstone of acute medical management of ACS and reduces recurrent ischemic events. Oxygen is not indicated at SpO2 97%; nitrates are not indicated when pain-free and normotensive; apixaban is not first-line antiplatelet therapy in ACS."}, {"id": "42", "title": "Aortic stenosis causing syncopal fall", "stem": "<p>An 82-year-old man is admitted 4 hours after a fall. His wife says his legs \"gave out\" when he stood up from his armchair. He was initially unresponsive but regained consciousness after 20 seconds. No incontinence. PMH: HTN, T2DM, BPH. Meds: amlodipine, metformin, atorvastatin, tamsulosin. Pulse 78, RR 18, BP 98/72, SpO2 97%. Cardiac: late-peaking, harsh systolic murmur at upper right sternal border without an appreciable S2. Carotid upstrokes diminished. Peripheral pulses symmetrically weak. Glucose 117 mg/dL. Which of the following is the most likely underlying cause of this patient's fall?</p>", "options": [["A", "A. Aortic stenosis"], ["B", "B. Autonomic dysreflexia"], ["C", "C. Hyperglycemia"], ["D", "D. Orthostatic hypotension"], ["E", "E. Vertebrobasilar insufficiency"]], "correct": "0", "explanation": "Late-peaking harsh systolic murmur at the upper right sternal border with diminished/delayed carotid upstrokes (pulsus parvus et tardus), absent S2, and weak peripheral pulses are classic for severe aortic stenosis. Severe AS produces fixed obstruction to LV outflow, leading to syncope (especially with exertion or postural change) due to inadequate cardiac output. Symptomatic AS triad = syncope, angina, dyspnea on exertion."}, {"id": "43", "title": "Normal ECG does not rule out ACS", "stem": "<p>A 38-year-old woman comes to ED in winter for evaluation of dyspnea and chest discomfort. Tight sensation began 4 hours ago shortly after she woke up. PMH: Hodgkin lymphoma 15 years ago, treated with chemo and mediastinal radiation. T 36.5°C, BP 168/94, pulse 82, RR 20, SpO2 97%. Anxious and mildly diaphoretic. Cardiac auscultation normal. No JVD or edema. Lungs clear. ECG: NSR with no acute ST-T changes. Serum troponin I 1.12 ng/mL (N<0.04). CXR no acute abnormalities. Which of the following is the most likely diagnosis?</p>", "options": [["A", "A. Acute coronary syndrome"], ["B", "B. Constrictive pericarditis"], ["C", "C. Pulmonary embolism"], ["D", "D. Restrictive cardiomyopathy"], ["E", "E. Type A aortic dissection"]], "correct": "0", "explanation": "Mediastinal radiation accelerates atherosclerosis and increases the long-term risk of ACS. Despite a normal ECG, the elevated troponin I confirms myocardial necrosis, which in this high-pretest-probability patient most likely represents acute coronary syndrome. A normal ECG does NOT exclude ACS, especially in patients with elevated cardiac biomarkers."}, {"id": "44", "title": "New AF in pregnancy unmasking mitral stenosis", "stem": "<p>A 23-year-old primigravida at 29 weeks comes to ED with sudden-onset severe shortness of breath. Woke today with fluttering sensation, progressive dyspnea, dry cough, inability to lie flat. Recent exercise intolerance attributed to pregnancy. Recurrent sore throat treated with tonsillectomy as a child. Lifetime nonsmoker, no alcohol. Sedentary. Immigrated from India 5 years ago. BP 110/60, pulse 144/min. ECG: atrial fibrillation with rapid ventricular response. Which of the following is the most likely diagnosis?</p>", "options": [["A", "A. Aortic insufficiency"], ["B", "B. Constrictive pericarditis"], ["C", "C. Hypertrophic cardiomyopathy"], ["D", "D. Mitral stenosis"], ["E", "E. Myocardial infarction"], ["F", "F. Peripartum cardiomyopathy"]], "correct": "3", "explanation": "A young woman from a region where rheumatic fever is endemic (India), with a history of recurrent sore throats, presenting in mid-pregnancy with new atrial fibrillation, pulmonary congestion, and orthopnea, has rheumatic mitral stenosis. The hemodynamic changes of pregnancy (increased blood volume and HR) and new-onset AF (loss of atrial kick + shortened diastolic filling) dramatically increase the transmitral gradient and precipitate pulmonary edema in previously asymptomatic patients."}, {"id": "45", "title": "Cardiogenic shock — next step in diagnosis", "stem": "<p>Four days after admission for treatment of an MI, a 72-year-old woman has sudden onset of dyspnea and confusion. Atrial fibrillation, T2DM, HTN, hypercholesterolemia. Meds: diltiazem, quinapril, metformin, simvastatin. T 35°C, pulse 116 irregular, RR 30, BP 92/58. SpO2 91% on 100% O2 face mask. Cool skin. JVD present. Decreased breath sounds at lung bases bilaterally. Scattered expiratory wheezes and crackles. Rub in lower lobe of left lung. 2+ pretibial/pedal edema. ABG pH 7.29, PCO2 30 mm Hg, PO2 64 mm Hg. CXR: cardiomegaly, bilateral pulmonary infiltrates, pleural effusions. Which of the following is the most appropriate next step in diagnosis?</p>", "options": [["A", "A. Cardiac catheterization"], ["B", "B. CT angiography"], ["C", "C. Echocardiography"], ["D", "D. Measurement of serum brain natriuretic peptide concentration"], ["E", "E. Radionuclide myocardial scan"]], "correct": "2", "explanation": "Cardiogenic shock following MI may be due to severe LV dysfunction, mechanical complications (papillary muscle/free wall rupture, VSD), tamponade, or arrhythmia. Echocardiography is the next step because it rapidly identifies the underlying cause (regional wall motion abnormalities, valvular dysfunction, septal rupture, effusion, RV dysfunction) and guides definitive therapy. BNP would not change acute management; CT angiography evaluates pulmonary embolism or dissection; cardiac cath is invasive and reserved for revascularization decisions."}, {"id": "46", "title": "Inferior STEMI — RV involvement", "stem": "<p>A 58-year-old man is brought to ED due to severe pressure-like central chest pain that began an hour ago. Nausea, no dyspnea. PMH: HTN, diet-controlled DM2. T 37.6°C, BP 94/62, pulse 64/min. Diaphoretic. Normal S1/S2, no murmurs. Lungs clear. ECG: ST-segment elevations in leads II, III, aVF, and V4R. Which of the following hemodynamic findings are most likely present in this patient?</p>", "options": [["A", "A. ↓ RV preload, ↓ LV preload, ↓ SVR"], ["B", "B. ↓ RV preload, ↑ LV preload, ↓ SVR"], ["C", "C. ↑ RV preload, ↓ LV preload, ↑ SVR"], ["D", "D. ↑ RV preload, ↑ LV preload, ↓ SVR"], ["E", "E. ↑ RV preload, ↑ LV preload, ↑ SVR"]], "correct": "2", "explanation": "V4R ST elevation confirms right ventricular myocardial infarction (RVMI). RV ischemia abruptly decreases RV contractility, causing ↑ RV end-diastolic volume (preload) and ↑ central venous pressure. Failed RV pumping reduces flow to the LA → ↓ PCWP and ↓ LV preload. Reduced LV output drops cardiac output, triggering compensatory ↑ systemic vascular resistance to maintain BP."}, {"id": "47", "title": "Coronary stent thrombosis (acute STEMI post-PCI)", "stem": "<p>A 68-year-old man with HTN and T2DM (former smoker, 30 pack-y) presented with intermittent chest pressure × 12 hours. ECG: NSR with T-wave inversions in I, aVL, V1–V3. Cath: 90% LAD stenosis treated with everolimus-eluting stent. Other vessels nonobstructive. Felt well after; admitted to telemetry. Overnight: anterior chest pain, dyspnea, dizziness. Cold/clammy. BP 80/55, pulse 122. ECG: sinus tachycardia with ST-elevation in V1–V4. What is the most likely diagnosis?</p>", "options": [["A", "A. Acute pericarditis"], ["B", "B. Coronary perforation"], ["C", "C. Coronary thrombosis"], ["D", "D. Left ventricular free wall rupture"], ["E", "E. Severe mitral regurgitation"]], "correct": "2", "explanation": "Acute STEMI in the LAD distribution following recent drug-eluting stent placement is most consistent with coronary stent thrombosis — a serious complication occurring acutely (≤24 h), subacutely (≤30 d), or late (up to a year). Risk is highest before re-endothelialization because exposed stent material is highly thrombogenic. Adequate dual antiplatelet therapy is critical for prevention."}, {"id": "48", "title": "Functional MR resolves after diuresis", "stem": "<p>A 34-year-old woman with idiopathic dilated cardiomyopathy comes to ED with progressive weight gain and dyspnea on exertion (skipped meds over holidays). BP 110/70, pulse 90, SpO2 92%. JVD, pedal edema. Bibasilar crackles. Grade 3/6 holosystolic murmur best heard at apex. Admitted; treated with IV diuretics. Four days later, symptoms improved; weight ↓ 5 kg. On discharge exam, lungs clear and no heart murmurs. Which of the following best explains the heart murmur heard in this patient on admission?</p>", "options": [["A", "A. Dynamic left ventricular outflow obstruction"], ["B", "B. Increased flow across the right ventricular outflow tract"], ["C", "C. Increased flow through a patent foramen ovale"], ["D", "D. Left ventricular papillary muscle displacement"], ["E", "E. Prolapse of the posterior mitral leaflet"]], "correct": "3", "explanation": "Decompensated heart failure causes secondary (functional) mitral regurgitation. Increased left ventricular end-diastolic volume dilates the mitral annulus and laterally displaces the papillary muscles, restricting chordae tendineae and preventing proper leaflet coaptation. Reducing LV volume with diuresis reverses the geometry and the regurgitation (and murmur) resolves."}, {"id": "f3_1", "title": "Electrocardiogram", "stem": "<p>A 7-month-old girl is brought to the physician because of a 2-day history of rapid breathing, sweating, pallor, decreased feeding, and increased fussiness. The mother says the patient had the same symptoms 3 weeks ago, but they were less severe and resolved spontaneously in less than 1 day. The patient is alert and fussy. She is at the 50th percentile for length and weight. Her temperature is 37.3°C (99.1°F), pulse is 220/min, respirations are 48/min, and blood pressure is 62/42 mm Hg. Capillary refill time is 3 seconds. Examination shows pink skin. The liver edge is palpated 3 cm below the right costal margin. The remainder of the examination shows no abnormalities. An ECG shows narrow complex tachycardia. Which of the following is the most appropriate next step in management?</p>", "options": [["A", "24-Hour ambulatory ECG monitoring"], ["B", "Echocardiography"], ["C", "Intravenous adenosine therapy"], ["D", "Intravenous digoxin therapy"], ["E", "Intravenous propranolol therapy"]], "correct": "C", "explanation": "\n<span class=\"answer-tag\">Correct: C — Intravenous adenosine therapy</span>\n<h4>Educational Objective</h4>\n<p>Supraventricular tachycardia (SVT) commonly occurs in children and infants, characterized by paroxysmal episodes of rapid, narrow-complex tachycardia. <strong>AV nodal blockade with adenosine is the first-line treatment</strong>. Adenosine binds the A1 receptor in the AV node, leading to cellular hyperpolarization and reduced transmission of supraventricular action potentials.</p>\n<p>Echocardiography may be used later to evaluate for underlying structural heart disease, but acute management comes first. Digoxin is used for CHF and atrial fibrillation, not SVT. Propranolol is a second-line agent.</p>\n<div class=\"meta\">Subject: <span>Internal Medicine</span> | System: <span>Cardiovascular</span> | Topic: <span>Electrocardiogram</span></div>\n"}, {"id": "f3_2", "title": "Atherosclerosis", "stem": "<p>A 25-year-old man comes to the physician for an examination prior to starting an exercise program consisting of swimming four times weekly. He feels well but wants to change his sedentary lifestyle. He has smoked one-half pack of cigarettes daily for 9 years. His father had a myocardial infarction at the age of 52 years. The patient is 178 cm (5 ft 10 in) tall and weighs 109 kg (240 lb); BMI is 34 kg/m². His pulse is 76/min, and blood pressure is 138/76 mm Hg. The remainder of the examination and an ECG show no other abnormalities. In addition to obtaining serum lipid studies and recommending that the patient stop smoking, which of the following is the most appropriate next step in management?</p>", "options": [["A", "Approval of the exercise program"], ["B", "Exercise stress test"], ["C", "Echocardiography"], ["D", "24-Hour ambulatory ECG monitoring"], ["E", "Cardiac catheterization"]], "correct": "A", "explanation": "\n<span class=\"answer-tag\">Correct: A — Approval of the exercise program</span>\n<h4>Educational Objective</h4>\n<p>Lifestyle modifications including increased physical activity, dietary modifications, and weight management are essential to reduce future cardiovascular disease risk. Other modifiable risk factors (hyperlipidemia, tobacco use) should be screened and managed as well.</p>\n<p>Stress testing is reserved for patients with angina, prior ACS with new symptoms, valvular disease, cardiomyopathy, or CHF. Echocardiography is unhelpful without symptoms or abnormal exam findings. 24-hour monitoring requires palpitations, syncope, or family history of sudden death.</p>\n<div class=\"meta\">Subject: <span>Internal Medicine</span> | System: <span>Cardiovascular</span> | Topic: <span>Atherosclerosis</span></div>\n"}, {"id": "f3_3", "title": "Electrocardiogram", "stem": "<p>A 52-year-old man is brought to the emergency department because of a 6-hour history of thirst and fatigue and a 2-hour history of light-headedness. He has been working outside during the past 2 days in temperatures reaching 90.0°F. He has no history of serious illness and takes no medications. On arrival, he is lethargic. He is oriented to person but not to place or time. His temperature is 37.2°C (99.0°F), pulse is 74/min and irregular, respirations are 16/min, and blood pressure is 95/64 mm Hg. The lungs are clear to auscultation. No bruits are heard. No murmurs are heard on cardiac examination. The abdomen is nontender. ECG is shown. In addition to intravenous administration of fluids, which of the following is the most appropriate next step in management?</p>", "options": [["A", "Adenosine therapy"], ["B", "Atropine therapy"], ["C", "Lidocaine therapy"], ["D", "Placement of a pacemaker"], ["E", "Observation only"]], "correct": "E", "explanation": "\n<span class=\"answer-tag\">Correct: E — Observation only</span>\n<h4>Educational Objective</h4>\n<p>Atrial fibrillation is characterized by an <strong>irregular, narrow-complex arrhythmia lacking P-waves</strong> on ECG. If the patient is hemodynamically stable with a normal ventricular rate, treatment is focused on correcting underlying conditions that may cause atrial fibrillation (in this case, dehydration).</p>\n<p>Atropine is for symptomatic bradycardia (this pulse 74 is normal). Lidocaine treats ventricular tachyarrhythmias. Pacemaker is for sick sinus syndrome, symptomatic bradycardia, or high-grade AV block.</p>\n<div class=\"meta\">Subject: <span>Internal Medicine</span> | System: <span>Cardiovascular</span> | Topic: <span>Electrocardiogram</span></div>\n", "image": "data:image/png;base64,/9j/4AAQSkZJRgABAQAAAQ rel, enalapril, rosuvastatin, and daily aspirin. He smoked one and one-half packs of cigarettes daily for 59 years but quit 3 years ago. He drinks two glasses of wine daily. His temperature is 37°C (98.6°F), pulse is 90/min and regular, respirations are 26/min, and blood pressure is 118/78 mm Hg. Examination shows jugular venous distention. Crackles are heard in the lung bases; scattered expiratory wheezes are heard in all lung fields. On cardiac examination, an S3 gallop is heard. There is 2+ pretibial and 3+ pedal edema bilaterally. A chest x-ray shows bilateral pulmonary infiltrates, prominent hilar vascularity, and cardiomegaly. Which of the following is most likely to be decreased in this patient?</p>", "options": [["A", "Central venous pressure"], ["B", "Pulmonary capillary wedge pressure"], ["C", "Shunt fraction (Qs/Qt)"], ["D", "Stroke volume index"], ["E", "Systemic vascular resistance"]], "correct": "D", "explanation": "\n<span class=\"answer-tag\">Correct: D — Stroke volume index</span>\n<h4>Educational Objective</h4>\n<p>The hemodynamic profile of acute decompensated heart failure and cardiogenic shock is characterized by: <strong>decreased stroke volume, decreased cardiac index, increased central venous pressure, increased pulmonary capillary wedge pressure, and increased systemic vascular resistance</strong>.</p>\n<p>Shunt fraction increases due to pulmonary edema decreasing alveolar surface area for gas exchange. SVR rises as a compensatory mechanism.</p>\n<div class=\"meta\">Subject: <span>Internal Medicine</span> | System: <span>Cardiovascular</span> | Topic: <span>Heart Failure</span></div>\n"}, {"id": "f3_5", "title": "Atherosclerosis", "stem": "<p>A 47-year-old woman with type 2 diabetes mellitus comes to the physician because of a 1-month history of indigestion after large meals and a 2-week history of poor exercise tolerance. She can no longer walk up one flight of stairs without becoming short of breath. She also has hypertension, hyperlipidemia, and osteoarthritis affecting both knees. Her mother had a myocardial infarction at the age of 60 years. The patient's medications are long-acting insulin, atorvastatin, enalapril, and 81-mg aspirin daily. She has never smoked cigarettes. She is 168 cm (5 ft 6 in) tall and weighs 82 kg (180 lb); BMI is 29 kg/m². Examination shows no abnormalities. A resting ECG shows no abnormalities. Which of the following is the most appropriate next step in diagnosis?</p>", "options": [["A", "Measurement of serum cardiac enzyme activities"], ["B", "Exercise stress test"], ["C", "Adenosine nuclear stress test"], ["D", "Echocardiography"], ["E", "Cardiac catheterization"]], "correct": "C", "explanation": "\n<span class=\"answer-tag\">Correct: C — Adenosine nuclear stress test</span>\n<h4>Educational Objective</h4>\n<p>Patients with risk factors for CAD and new symptoms such as angina or exertional dyspnea should be assessed for obstructive coronary disease via a stress test. For patients with normal resting ECG who can exercise, an exercise stress test is preferred. <strong>For those unable to exercise (osteoarthritis affects knees here) or with abnormal ECGs, a pharmacologic nuclear stress test is used.</strong></p>\n<p>Cardiac catheterization is for established CAD refractory to medical management. Echocardiography assesses ejection fraction and valves but not CAD directly.</p>\n<div class=\"meta\">Subject: <span>Internal Medicine</span> | System: <span>Cardiovascular</span> | Topic: <span>Atherosclerosis</span></div>\n"}, {"id": "f3_6", "title": "Electrocardiogram", "stem": "<p>A previously healthy 3-month-old boy is brought to the physician because of a 24-hour history of increasingly rapid breathing, difficulty feeding, and progressive fussiness. He has not had fever, but he has received acetaminophen to ease his fussiness. He receives no other medications. He is exclusively breast-fed. He is alert and pale and appears anxious. His pulse is 250/min, respirations are 68/min, and blood pressure is 80/50 mm Hg. He is not using accessory muscles of respiration. Pulse oximetry on room air shows an oxygen saturation of 99%. Capillary refill time is 2 seconds. Examination shows pink lips and moist oral mucosa. The lungs are clear to auscultation. No murmurs or gallops are heard. The precordium is hyperdynamic. The abdomen is soft. The liver edge is palpated 3 cm below the right costal margin, and the spleen tip is palpated 2 cm below the left costal margin. Distal pulses are palpable. Laboratory studies show: Hgb 9 g/dL, Hct 27%, WBC 8000, Plt 212,000. An ECG is shown. Which of the following is the most likely diagnosis?</p>", "options": [["A", "Atrial flutter"], ["B", "Congenital hemolytic anemia"], ["C", "Iron deficiency"], ["D", "Myocarditis"], ["E", "Pericarditis"], ["F", "Prolonged QT syndrome"], ["G", "Supraventricular tachycardia"]], "correct": "G", "explanation": "\n<span class=\"answer-tag\">Correct: G — Supraventricular tachycardia</span>\n<h4>Educational Objective</h4>\n<p>Supraventricular tachycardia refers to an <strong>abnormally rapid pulse and rhythm originating from above the ventricles, typically with a narrow QRS complex on ECG</strong>. Heart failure features (hepatomegaly, S3, pulmonary edema) can result from sustained SVT.</p>\n<p>Pericarditis presents with chest pain and friction rub. Prolonged QT shows long QT on ECG. Myocarditis often has heart failure features but with broader symptoms.</p>\n<div class=\"meta\">Subject: <span>Internal Medicine</span> | System: <span>Cardiovascular</span> | Topic: <span>Electrocardiogram</span></div>\n", "image": "data:image/png;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAC zxV5dNwANw2i8FXIEgFNNSYD8/vHL63OKvxq/2gg8cvrc4q/Gr/aCCPs3wP+qPhX8Cj947iCCAIVn3VtNgoNDWCCA06Zl4zQWXVXW06Rnz8zmW5ppXsIIIqrkTswUAlzr2ESVOP6c8EEAmqbfGJfzT6PaGnJ6YSNHP0EEEAS07MLXRS9PkIm7OPpVQOfoIIIChqZeSt0hZqTFonH7f5nTsIIICpE/MqOrnTsImiemFINXP0EEERC8vMvNKcsWRcrXSLfpGZ/1P/aIIIqoDEJqivin8hGFz8yRTMNCKHQQQREVSM0+2LEOkJHTSGDiEzer4n6CCCAHsQmQyFBzWvYRUuemVy4udPMNdBBBFUvh8/MhptAdNPkIccxCZsJDmvyEEEAIxCZKAS4a/IQjiU/Mrl3UKdNp9hBBAMsT8yJdFHTt2EZ+kZq5Izjr7CCCAHcRmkkUdP5CKMVnZhbCgXSB7AQQQF0niE0pKQp0kU7CMu4hNACjx/IQQREDeIzSgaun8hFc1MPPBGY6o2q02ggiqmcRmghJDx/IRYZ+Zr/NO3YQQREQdxCaTSjx/IQpiE3MOKYvdJovTQQQRVPCfmS0FZpr8hFP0nN/6p/IQQQFhxCauPxTt2EJTU7MreaUp01SrTQQQQGwan5kq1dP5CLEzsxzfEO/YQQQEPPTNVfFP5CFXJp9UyhZdVcnbaCCIhsT0xafiHT2EYVPTNf5p3PQQQRVWrnpgf+Z07CNYJp/6SSvNVdZTpBBAMJxGazKZxp8hE25+aU4Ul40+QgggIu4hNJpR4/kIWbmHkTK3EuqC1bnSCCAZRiE0d3TtXYRlOITVv807dhBBAYOIzWXXNNfkIXlZh5lx0tuqBUanaCCAZOITVf5x/IRFeIzQXTNP5CCCAtfnJgNmjyv0hPDpyYQwoJdVSp7QQQFreITZcUC+qnyH/wBRa3PzKm1KLpr8hBBAV+fmVotU6SCNdBEWpp9puxt1QT/aCCAuRPzRGrx37CCYn5pJ5XSP7CCCIil2cmHWVIW6opUKHaLJeYeZl0obcUEg+0EEVQMQmswpzjT5CJefma/zjv2EEEBXMzkwthYU6qlD2i2Um3/LI+Kr0+0EEQTbnJgpqXVfkIoVOzJJ+Or9IIIoxMvvPyxDjqiK+0XpmX0MgJdUAE6bQQQAicmC0SXlVHyjPnJiyuaqv9oIIgy8+64kJU4SP7RJuafuSM1VP7QQRR8LeOP1ucVfjVf/AAIIIIiP/9k="}, {"id": "f3_7", "title": "Vascular Disorders", "stem": "<p>A 17-year-old boy is brought to the emergency department 30 minutes after he was thrown through a window during an altercation. He has no history of serious illness and takes no medications. He is alert and fully oriented. He reports moderate pain in his right arm and hand. His pulse is 110/min, respirations are 22/min, and blood pressure is 110/70 mm Hg. Pulse oximetry on 2 L/min of oxygen by nasal cannula shows an oxygen saturation of 98%. Examination shows superficial abrasions over the right side of the face. A 4 x 4-cm glass shard protrudes from the right upper extremity 2 cm proximal to the medial epicondyle; the extremity is cool and pale, and radial and ulnar pulses are not palpable. Which of the following is the most appropriate next step in management?</p>", "options": [["A", "Angiography of the right upper extremity"], ["B", "Duplex ultrasonography of the right upper extremity"], ["C", "Immediate removal of the foreign body in the ED"], ["D", "MR arteriography of the right upper extremity"], ["E", "Operative wound exploration"]], "correct": "E", "explanation": "\n<span class=\"answer-tag\">Correct: E — Operative wound exploration</span>\n<h4>Educational Objective</h4>\n<p>In patients with an obvious arterial injury (such as with asymmetric or absent pulses, cool skin, or a pale extremity), <strong>emergent exploration and management in the operating room is necessary</strong>.</p>\n<p>Imaging modalities (angiography, duplex US, MR arteriography) delay treatment. Removing the foreign body in the ED may cause severe bleeding (it may be tamponading the artery).</p>\n<div class=\"meta\">Subject: <span>Surgery</span> | System: <span>Cardiovascular</span> | Topic: <span>Vascular Disorders</span></div>\n"}, {"id": "f3_8", "title": "Atherosclerosis / MI Complications", "stem": "<p>A 62-year-old man, who is recovering in the coronary care unit following an acute ST-segment elevation anterior wall myocardial infarction 4 days ago, is being evaluated for the sudden onset of dyspnea and diaphoresis. At the time of admission, tissue plasminogen activator therapy was initiated, and the patient's recovery had been uncomplicated. Vital signs are temperature 37°C (98.6°F), pulse 128/min, respirations 36/min, and blood pressure 82/58 mm Hg. Pulse oximetry on 100% oxygen via nonrebreather face mask shows an oxygen saturation of 89%. Jugular venous pressure is 8 cm H2O (N=5-9). Auscultation of the lungs discloses diffuse crackles halfway up the back. Cardiac examination discloses a hyperdynamic precordium and a grade 3/6 holosystolic murmur that was not present on previous examinations. There is no clubbing, cyanosis, or edema of the extremities. Based on these findings, the patient's condition is most likely attributable to which of the following?</p>", "options": [["A", "Aortic valvular insufficiency"], ["B", "Chordae tendineae rupture"], ["C", "Extension of myocardial infarction"], ["D", "Left ventricular free wall rupture"], ["E", "Tricuspid valve insufficiency"]], "correct": "B", "explanation": "\n<span class=\"answer-tag\">Correct: B — Chordae tendineae rupture</span>\n<h4>Educational Objective</h4>\n<p>Severe mechanical complications of acute MI include <strong>left ventricular free wall rupture, papillary muscle necrosis with rupture of the chordae tendineae, and rupture of the interventricular septum</strong>. Chordae tendineae rupture is associated with severe acute mitral regurgitation and consequent heart failure with pulmonary edema.</p>\n<p>LV free wall rupture causes rapid hypotension, shock, and tamponade. Tricuspid insufficiency is heard at the LLSB, often from pulmonary HTN or IV drug-related endocarditis.</p>\n<div class=\"meta\">Subject: <span>Internal Medicine</span> | System: <span>Cardiovascular</span> | Topic: <span>Atherosclerosis</span></div>\n"}, {"id": "f3_9", "title": "Electrocardiogram", "stem": "<p>A 67-year-old man is brought to the emergency department because of a 20-minute history of palpitations, dizziness, and fatigue. He has hypertension controlled with hydrochlorothiazide and lisinopril. His pulse is 110/min and irregular, respirations are 18/min, and blood pressure is 126/70 mm Hg. Examination shows no other abnormalities. An ECG shows atrial fibrillation. Which of the following is the most appropriate next step in management?</p>", "options": [["A", "Cardiac catheterization"], ["B", "Chemical cardioversion"], ["C", "Clopidogrel therapy"], ["D", "Low-molecular-weight heparin therapy"], ["E", "Metoprolol therapy"]], "correct": "E", "explanation": "\n<span class=\"answer-tag\">Correct: E — Metoprolol therapy</span>\n<h4>Educational Objective</h4>\n<p>Metoprolol is a first-line agent for <strong>atrial fibrillation with rapid ventricular response</strong>. Generally, rate control is preferable to rhythm control as the risk for adverse outcomes is lower.</p>\n<p>Cardioversion typically follows weeks of anticoagulation or absence of intracardiac thrombosis on TEE. Emergent electrical cardioversion is for hemodynamically unstable patients. Clopidogrel and LMWH may be needed but rate control is first.</p>\n<div class=\"meta\">Subject: <span>Internal Medicine</span> | System: <span>Cardiovascular</span> | Topic: <span>Electrocardiogram</span></div>\n"}, {"id": "f3_10", "title": "Atherosclerosis", "stem": "<p>A 57-year-old man comes to the office because of a 2-month history of intermittent chest pain. He describes the pain as a squeezing sensation in the center of his chest that lasts for 2 to 3 minutes. The pain worsens when he walks outside or becomes upset. He also has noted the pain after eating large meals. He has not had nausea or vomiting. He has hypertension, hypercholesterolemia, and osteoarthritis. Medications are hydrochlorothiazide, simvastatin, and acetaminophen. Family history is noncontributory. The patient does not smoke cigarettes. He is 178 cm (5 ft 10 in) tall and weighs 102 kg (225 lb); BMI is 32 kg/m². His pulse is 80/min, respirations are 12/min, and blood pressure is 142/92 mm Hg. Lungs are clear to auscultation. On cardiac examination, a regular rhythm and prominent S4 are heard with no murmurs. ECG shows nonspecific ST-T wave abnormalities in leads V3-V4. Which of the following is the most likely diagnosis?</p>", "options": [["A", "Angina pectoris"], ["B", "Esophageal spasm"], ["C", "Gastroesophageal reflux disease"], ["D", "Myocardial infarction"], ["E", "Pulmonary embolism"]], "correct": "A", "explanation": "\n<span class=\"answer-tag\">Correct: A — Angina pectoris</span>\n<h4>Educational Objective</h4>\n<p>Angina pectoris results from a mismatch of myocardial perfusion and demand, most commonly caused by <strong>coronary artery disease and atherosclerotic plaque buildup</strong>. Patients typically develop symptoms during exertion, heightened emotional states, and after heavy meals.</p>\n<p>MI involves irreversible cell damage and is more acute and severe. PE classically presents with pleuritic chest pain, dyspnea, and hypoxemia.</p>\n<div class=\"meta\">Subject: <span>Internal Medicine</span> | System: <span>Cardiovascular</span> | Topic: <span>Atherosclerosis</span></div>\n"}, {"id": "f3_11", "title": "Electrocardiogram", "stem": "<p>Patient with hemodynamically unstable atrial fibrillation. Respirations are 16/min, and blood pressure is 78/50 mm Hg. The lungs are clear to auscultation; no bruits are heard. No murmurs are noted on cardiac examination. The abdomen is nontender. ECG is shown. In addition to administration of 0.9% saline, which of the following is the most appropriate next step in management?</p>", "options": [["A", "Administration of amiodarone"], ["B", "Administration of diltiazem"], ["C", "Administration of labetalol"], ["D", "Carotid massage"], ["E", "Electrical cardioversion"]], "correct": "E", "explanation": "\n<span class=\"answer-tag\">Correct: E — Electrical cardioversion</span>\n<h4>Educational Objective</h4>\n<p>Hemodynamically unstable atrial fibrillation with rapid ventricular response requires <strong>immediate treatment with synchronized cardioversion</strong> to restore normal sinus rhythm and adequate cardiac output.</p>\n<p>Diltiazem and labetalol are appropriate for stable patients with rapid ventricular response. Amiodarone is rhythm control. Carotid sinus massage is a first-line attempt to slow SVT (e.g., AVNRT), not a-fib.</p>\n<div class=\"meta\">Subject: <span>Internal Medicine</span> | System: <span>Cardiovascular</span> | Topic: <span>Electrocardiogram</span></div>\n"}, {"id": "f3_12", "title": "Electrocardiogram", "stem": "<p>A 62-year-old woman is brought to the emergency department by paramedics 30 minutes after the onset of sharp, anterior chest pain. She is otherwise asymptomatic. Administration of nitroglycerin en route to the hospital has not relieved her symptoms. She has type 2 diabetes mellitus, hypertension, and peripheral artery disease. She underwent laparoscopic cholecystectomy 1 year ago. Her medications are insulin, ramipril, hydrochlorothiazide, atorvastatin, and aspirin. Her pulse is 96/min, respirations are 12/min, and blood pressure is 124/76 mm Hg. The lungs are clear. Normal S1 and S2. Peripheral pulses are decreased bilaterally. An ECG shows a left bundle branch block; review of her medical records shows that a routine ECG 1 year ago showed no abnormalities. Her serum troponin I and myoglobin concentrations are within the reference ranges. The patient is admitted to the hospital. Which of the following is the most appropriate next step in diagnosis?</p>", "options": [["A", "Exercise stress test"], ["B", "Cardiac stress scintigraphy"], ["C", "Positron emission tomography"], ["D", "Electrophysiologic studies"], ["E", "Cardiac catheterization"]], "correct": "E", "explanation": "\n<span class=\"answer-tag\">Correct: E — Cardiac catheterization</span>\n<h4>Educational Objective</h4>\n<p>Acute coronary syndrome can present with acute chest pain in conjunction with ECG changes (here, <strong>new LBBB</strong>). Acute coronary syndrome is treated with full-dose anticoagulation and dual antiplatelet therapy followed by <strong>cardiac catheterization</strong>.</p>\n<p>Stress tests are useful only after ACS is ruled out. PET aids tumor localization. Electrophysiology studies evaluate conduction system abnormalities.</p>\n<div class=\"meta\">Subject: <span>Internal Medicine</span> | System: <span>Cardiovascular</span> | Topic: <span>Electrocardiogram</span></div>\n"}, {"id": "f3_13", "title": "Valvular Heart Disease / CHF", "stem": "<p>An 82-year-old woman is brought to the emergency department by her daughter because of shortness of breath. Each night for the past week, the patient has awakened with shortness of breath; she has found that using three pillows instead of one allows her to breathe more easily at night. Two days ago, she had shortness of breath with exertion, and 8 hours ago, she had the sudden onset of mild shortness of breath at rest. She also has a 4-day history of swelling of her ankles and feet. Her only medication is 81-mg aspirin. On arrival, she is in mild respiratory distress but able to speak in complete sentences. Her temperature is 37°C (98.6°F), pulse is 86/min, respirations are 16/min, and blood pressure is 162/88 mm Hg. Examination shows jugular venous distention. Bilateral basilar crackles are heard over the lower quarter of the lung fields. Cardiac examination shows a regular rhythm. A grade 2/6 holosystolic murmur is heard best at the apex with the patient in the left lateral decubitus position. There is 2+ pitting edema of the ankles. In addition to furosemide, administration of which of the following is the most appropriate next step in pharmacotherapy?</p>", "options": [["A", "Digoxin"], ["B", "Dobutamine"], ["C", "Lisinopril"], ["D", "Milrinone"], ["E", "Nifedipine"], ["F", "Nitroprusside"]], "correct": "C", "explanation": "\n<span class=\"answer-tag\">Correct: C — Lisinopril</span>\n<h4>Educational Objective</h4>\n<p><strong>ACE inhibitors, such as lisinopril, decrease mortality and are first-line therapy</strong> in the treatment and management of congestive heart failure, in addition to diuretics to decrease volume overload.</p>\n<p>Dobutamine and milrinone are for cardiogenic shock signs (hypotension, cool extremities). Nifedipine and nitroprusside are antihypertensives. Digoxin is later-line.</p>\n<div class=\"meta\">Subject: <span>Internal Medicine</span> | System: <span>Cardiovascular</span> | Topic: <span>Valvular Heart Disease</span></div>\n"}];
    let index = 0;
    const state = Object.fromEntries(questions.map(q => [q.id, { selected: null, submitted: false }]));

    const chipsEl = document.getElementById('chips');
    const qBadge = document.getElementById('qBadge');
    const titleEl = document.getElementById('title');
    const stemEl = document.getElementById('stem');
    const optionsEl = document.getElementById('options');
    const explanationEl = document.getElementById('explanation');
    const feedbackEl = document.getElementById('feedback');
    const heroEl = document.getElementById('hero');
    const submitBtn = document.getElementById('submitBtn');
    const resetBtn = document.getElementById('resetBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function renderChips() {
      chipsEl.innerHTML = '';
      questions.forEach((q, i) => {
        const btn = document.createElement('button');
        btn.className = 'chip' + (i === index ? ' active' : '');
        btn.textContent = String(i + 1);
        btn.onclick = () => { index = i; render(); };
        chipsEl.appendChild(btn);
      });
    }

    function render() {
      const q = questions[index];
      const s = state[q.id];
      qBadge.textContent = 'Q ' + String(index + 1);
      titleEl.textContent = q.title;
      stemEl.innerHTML = q.stem;
      heroEl.innerHTML = q.image ? `<div class="image-wrap"><img src="${q.image}" alt="Medical image for question ${index + 1}"></div>` : '';
      optionsEl.innerHTML = '';

      q.options.forEach(([letter, text]) => {
        const btn = document.createElement('button');
        btn.className = 'option';
        if (s.selected === letter) btn.classList.add('selected');
        if (s.submitted && letter === q.correct) btn.classList.add('correct');
        if (s.submitted && s.selected === letter && letter !== q.correct) btn.classList.add('wrong');
        btn.innerHTML = `<div class="letter">${letter}</div><div><strong>${letter}.</strong> ${text}</div>`;
        btn.onclick = () => {
          if (s.submitted) return;
          s.selected = letter;
          render();
        };
        optionsEl.appendChild(btn);
      });

      if (s.submitted) {
        const ok = s.selected === q.correct;
        feedbackEl.className = 'feedback show ' + (ok ? 'ok' : 'no');
        feedbackEl.innerHTML = ok
          ? `✅ Correct. Answer: <strong>${q.correct}</strong>`
          : `❌ Incorrect. Your answer: <strong>${s.selected ?? '—'}</strong> &nbsp;|&nbsp; Correct answer: <strong>${q.correct}</strong>`;
        explanationEl.className = 'explanation show';
        explanationEl.innerHTML = q.explanation;
      } else {
        feedbackEl.className = 'feedback';
        feedbackEl.innerHTML = '';
        explanationEl.className = 'explanation';
        explanationEl.innerHTML = '';
      }

      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === questions.length - 1;
      renderChips();
    }

    submitBtn.onclick = () => {
      const q = questions[index];
      const s = state[q.id];
      if (!s.selected) {
        feedbackEl.className = 'feedback show no';
        feedbackEl.innerHTML = 'Please choose an option first.';
        return;
      }
      s.submitted = true;
      render();
    };

    resetBtn.onclick = () => {
      const q = questions[index];
      state[q.id] = { selected: null, submitted: false };
      render();
    };

    prevBtn.onclick = () => { if (index > 0) { index -= 1; render(); } };
    nextBtn.onclick = () => { if (index < questions.length - 1) { index += 1; render(); } };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextBtn.click();
      if (e.key === 'ArrowLeft') prevBtn.click();
    });

    render();
  </script>
