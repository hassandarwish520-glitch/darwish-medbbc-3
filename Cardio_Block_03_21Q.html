<!DOCTYPE html>
<html lang='en' dir='ltr'>
<head>
  <meta charset='UTF-8' />
  <meta name='viewport' content='width=device-width, initial-scale=1.0' />
  <title>Cardio_Block_03_21Q.html</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #121922;
      --panel-2: #171f2b;
      --text: #e8eef7;
      --muted: #97a6ba;
      --border: #283241;
      --accent: #3b82f6;
      --green: #17803d;
      --green-2: #0f5d2b;
      --red: #8b1e2b;
      --yellow: #fff06a;
      --yellow-text: #1e1b00;
      --shadow: 0 12px 32px rgba(0,0,0,.28);
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, Arial, sans-serif; background: radial-gradient(circle at top, #17202d 0%, var(--bg) 38%); color: var(--text); }
    a { color: inherit; }
    .app { min-height:100vh; display:grid; grid-template-columns: 320px 1fr; }
    .sidebar { background: rgba(10,14,20,.88); border-right:1px solid var(--border); padding: 22px 18px; position: sticky; top:0; height:100vh; overflow:auto; }
    .brand { font-size: 1.25rem; font-weight: 800; margin-bottom: 6px; }
    .sub { color: var(--muted); font-size: .93rem; line-height:1.5; }
    .chips { display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
    .chip { border:1px solid var(--border); background: var(--panel); color: var(--text); border-radius:14px; padding:10px 12px; cursor:pointer; font-weight:700; min-width:54px; text-align:center; }
    .chip.active { background: linear-gradient(180deg,#264163,#1c3150); border-color:#426793; }
    .summary { margin-top:20px; padding:14px; border:1px solid var(--border); background: var(--panel); border-radius:18px; color:var(--muted); font-size:.92rem; line-height:1.6; }
    .main { padding: 24px; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
    .toolbar-left, .toolbar-right { display:flex; align-items:center; gap:10px; }
    .q-badge { background: #161f2c; border:1px solid #334154; min-width:72px; text-align:center; padding:12px 14px; border-radius:16px; font-weight:800; box-shadow: var(--shadow); }
    .icon-btn { background: #131a25; border:1px solid var(--border); color: var(--text); width:46px; height:46px; border-radius:14px; cursor:pointer; font-size:1.1rem; }
    .card { max-width: 980px; margin:0 auto; background: rgba(14,20,29,.92); border:1px solid var(--border); border-radius: 28px; overflow:hidden; box-shadow: var(--shadow); }
    .hero { padding:24px 24px 0; }
    .image-wrap { border-radius: 22px; overflow:hidden; border:1px solid var(--border); background:#fff; }
    .hero img { width:100%; display:block; max-height:430px; object-fit:contain; background:#fff; }
    .content { padding: 26px; }
    .eyebrow { color:#7fb1ff; font-size:.84rem; letter-spacing:.08em; text-transform:uppercase; font-weight:800; }
    h1 { margin:10px 0 8px; font-size:1.65rem; line-height:1.25; }
    .stem { color:var(--text); line-height:1.76; font-size:1rem; }
    .stem p, .stem ul, .stem table { margin: 0 0 16px; }
    .stem ul { padding-left: 22px; }
    table { width:100%; border-collapse: collapse; overflow:hidden; border-radius:16px; border:1px solid var(--border); background:#10161f; }
    th, td { padding:12px 14px; border:1px solid var(--border); text-align:left; }
    th { background:#182231; }
    .options { display:grid; gap:14px; margin-top:22px; }
    .option { width:100%; text-align:left; display:flex; gap:14px; align-items:flex-start; border:1px solid #304056; background: linear-gradient(180deg,#1a2230,#151c27); color:var(--text); border-radius:22px; padding:18px 18px; cursor:pointer; transition:.18s ease; }
    .option:hover { transform: translateY(-1px); border-color:#4e6787; }
    .option .letter { width:30px; height:30px; border-radius:999px; border:2px solid #cfd7e4; display:grid; place-items:center; flex:0 0 auto; margin-top:1px; font-weight:800; font-size:.92rem; }
    .option.selected { border-color:#5b8bd6; box-shadow: inset 0 0 0 1px #5b8bd6; }
    .option.correct { background: linear-gradient(180deg,#218545,#156d36); border-color:#4ed37e; }
    .option.correct .letter { border-color:#b9ffd0; }
    .option.wrong { background: linear-gradient(180deg,#70212e,#5a1621); border-color:#d06d7d; }
    .option.wrong .letter { border-color:#ffd0d6; }
    .controls { display:flex; flex-wrap:wrap; gap:12px; margin-top:22px; }
    .primary, .secondary { border:none; border-radius:16px; padding:14px 18px; font-weight:800; cursor:pointer; }
    .primary { background:#3566d6; color:white; }
    .secondary { background:#1a2230; color:var(--text); border:1px solid var(--border); }
    .feedback { margin-top:18px; padding:14px 16px; border-radius:18px; font-weight:800; display:none; }
    .feedback.show { display:block; }
    .feedback.ok { background: rgba(23,128,61,.18); border:1px solid rgba(78,211,126,.4); color:#bff3d0; }
    .feedback.no { background: rgba(139,30,43,.18); border:1px solid rgba(208,109,125,.4); color:#ffd7de; }
    .explanation { display:none; margin-top:22px; padding:22px; background:#10161f; border:1px solid var(--border); border-radius:22px; line-height:1.75; }
    .explanation.show { display:block; }
    .objective { margin-top:16px; background: var(--yellow); color: var(--yellow-text); padding:14px 16px; border-radius:16px; font-weight:700; }
    .footer-note { margin-top:18px; color:var(--muted); font-size:.9rem; }
    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { position:static; height:auto; }
      .main { padding: 14px; }
      .content { padding:20px; }
      h1 { font-size:1.35rem; }
    }
  </style>
</head>

  <script>
    const questions = [{"id": "f3_14", "title": "Atherosclerosis", "stem": "<p>A 25-year-old woman comes to the office for a health maintenance examination. She is on active duty in the US Air Force, and her primary duty is flying drones. She reports no symptoms. Medical history is unremarkable, and she takes no medications. She does not smoke cigarettes or drink alcoholic beverages. Her paternal grandmother had a myocardial infarction at the age of 62 years. Vital signs are within normal limits. Physical examination discloses no abnormalities. Results of fasting serum lipid studies obtained 1 year ago: Total cholesterol 205 mg/dL, HDL 45 mg/dL, LDL 150 mg/dL, Triglycerides 50 mg/dL. Which of the following is the most appropriate screening laboratory study at this time?</p>", "options": [["A", "LDL-receptor activity assay"], ["B", "Measurement of serum apolipoprotein(a) concentration"], ["C", "Measurement of serum C-reactive protein concentration"], ["D", "Repeat measurement of fasting serum lipid studies"], ["E", "No further testing is indicated"]], "correct": "E", "explanation": "\n<span class=\"answer-tag\">Correct: E — No further testing is indicated</span>\n<h4>Educational Objective</h4>\n<p>Most asymptomatic men over age 35 and <strong>women over age 40-45</strong> should be screened for hyperlipidemia. Patients below these ages rarely have an indication for screening unless there is a compelling reason such as family history of hypercholesterolemia or early CVD in a first-degree relative.</p>\n<p>This 25-year-old woman with normal exam, no symptoms, and grandmother (not first-degree relative) MI at 62 doesn't qualify for additional testing.</p>\n<div class=\"meta\">Subject: <span>Internal Medicine</span> | System: <span>Cardiovascular</span> | Topic: <span>Atherosclerosis</span></div>\n"}, {"id": "f3_15", "title": "Electrocardiogram", "stem": "<p>A 77-year-old woman is brought to the physician by her son because of palpitations for the past month. She had a cerebral infarction 5 years ago and has residual partial paralysis of her right leg. She uses an orthotic brace on her right ankle and a walker. She has fallen three times during the past year but has not sustained any injuries. She has a 5-year history of type 2 diabetes mellitus treated with metformin. Her vision is 20/60 in her left eye, but she is able to read large print. Her pulse is 120/min and irregularly irregular, and blood pressure is 135/78 mm Hg. Crackles are heard at the lung bases. A grade 2/6 systolic murmur is heard best at the lower left sternal border. Abdominal examination shows no abnormalities. There is 2+ edema below the knees. Neurologic examination shows unchanged hemiparesis. Hematocrit 37%, Leukocyte 4700, Urea 27, Creatinine 1.4. ECG shows a-fib with rate between 90 and 140/min. Echocardiography shows EF 40%. Which of the following is the most appropriate next step in management?</p>", "options": [["A", "Measurement of serum thyroid-stimulating hormone concentration"], ["B", "Tilt test"], ["C", "24-Hour ambulatory ECG monitoring"], ["D", "Electrophysiologic studies"], ["E", "Placement of a cardiac pacemaker"]], "correct": "A", "explanation": "\n<span class=\"answer-tag\">Correct: A — Measurement of serum TSH concentration</span>\n<h4>Educational Objective</h4>\n<p>New-onset atrial fibrillation requires evaluation for hemodynamic stability, hospitalization need, heart failure symptoms, <strong>potential underlying causes (structural heart disease, electrolyte disturbances, hyperthyroidism, alcohol/stimulant use)</strong>, and need for anticoagulation to decrease stroke risk.</p>\n<p>Electrophysiology is reserved for refractory cases. Pacemaker placement is for sinus node dysfunction, symptomatic bradycardia, or high-grade AV block.</p>\n<div class=\"meta\">Subject: <span>Internal Medicine</span> | System: <span>Cardiovascular</span> | Topic: <span>Electrocardiogram</span></div>\n"}, {"id": "f3_16", "title": "Cardiac Infections / Lyme", "stem": "<p>A 28-year-old primigravid woman at 7 weeks' gestation is admitted to the hospital because of a 2-day history of shortness of breath, palpitations, and light-headedness. Pregnancy had been uncomplicated. She has no history of serious illness, and her only medication is a prenatal vitamin. Two months ago, she visited her parents' farm in Wisconsin. The patient's temperature is 37.8°C (100°F), pulse is 38/min, respirations are 20/min, and blood pressure is 110/70 mm Hg. Pulse oximetry on room air shows an oxygen saturation of 96%. Forehead movement is decreased. There is left facial droop, and the patient is unable to close her left eye. An ECG is shown. Which of the following is the most appropriate next step in management?</p>", "options": [["A", "Administration of ceftriaxone"], ["B", "Administration of doxycycline"], ["C", "Administration of mifepristone"], ["D", "Administration of prednisone"], ["E", "Placement of a pacemaker"]], "correct": "A", "explanation": "\n<span class=\"answer-tag\">Correct: A — Administration of ceftriaxone</span>\n<h4>Educational Objective</h4>\n<p>Lyme disease (caused by <strong>Borrelia burgdorferi</strong>) characteristically causes erythema chronicum migrans. Early Lyme is treated with doxycycline, but doxycycline is <strong>contraindicated in pregnancy</strong> (causes tooth discoloration, bone growth inhibition). <strong>Later stages of Lyme disease that affect the heart or CNS are generally treated with parenteral ceftriaxone.</strong></p>\n<p>This patient has Bell's palsy + AV block + Wisconsin tick exposure = late Lyme. Pacemaker is rarely needed (rhythm disturbances usually resolve within days).</p>\n<div class=\"meta\">Subject: <span>Internal Medicine</span> | System: <span>Cardiovascular</span> | Topic: <span>Cardiac Infections</span></div>\n", "image": "data:image/png;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9  L/min of oxygen by nasal cannula shows an oxygen saturation of 85%. Examination shows cool, mottled skin. Jugular venous pulsations are present 8 cm above the sternal angle. Examination of the chest shows healing ecchymoses and mild tenderness over the ribs on the left. Crackles are heard at both lung bases. S1 and S2 are normal; an S3 is heard. An ECG shows ST-segment depression and a left bundle branch block. Which of the following is the most likely diagnosis?</p>", "options": [["A", "Acute pericarditis"], ["B", "Cardiac tamponade"], ["C", "Myocardial infarction"], ["D", "Pneumothorax"], ["E", "Pulmonary embolism"]], "correct": "C", "explanation": "\n<span class=\"answer-tag\">Correct: C — Myocardial infarction</span>\n<h4>Educational Objective</h4>\n<p>Cardiogenic shock can occur in the setting of acute MI, severe valvular dysfunction, severe heart failure, AV block, or arrhythmia. Signs include <strong>hypotension, cool and pale extremities, JVD, and pulmonary edema</strong>. NSAIDs (naproxen) increase risk for ACS and MI.</p>\n<p>Tension pneumothorax causes tracheal deviation and hyperresonance. PE shows S1Q3T3 pattern. Tamponade has distant heart sounds and pulsus paradoxus.</p>\n<div class=\"meta\">Subject: <span>Internal Medicine</span> | System: <span>Cardiovascular</span> | Topic: <span>Atherosclerosis</span></div>\n"}, {"id": "f3_18", "title": "Cardiac Infections / Endocarditis", "stem": "<p>A 17-year-old boy with intellectual developmental disorder is brought to the physician because of low-grade fever and abdominal pain for 6 days. His temperature is 37.8°C (100.1°F), pulse is 110/min, respirations are 22/min, and blood pressure is 120/70 mm Hg. Examination shows splinter hemorrhages under the nails. A grade 2/6 systolic murmur is heard best at the upper left sternal border. There is a systolic ejection click. S1 and S2 are normal. Abdominal examination shows splenomegaly. Laboratory studies show: Hgb 9.1, WBC 30,000, Plt 928,000, ESR 110, Urine: Blood 2+, Protein 1+. Which of the following is the most appropriate next step in management?</p>", "options": [["A", "24-Hour urine collection for protein and creatinine"], ["B", "Blood cultures"], ["C", "Ultrasonography of the abdomen"], ["D", "CT scan of the abdomen"], ["E", "Broad-spectrum antibiotic therapy"]], "correct": "B", "explanation": "\n<span class=\"answer-tag\">Correct: B — Blood cultures</span>\n<h4>Educational Objective</h4>\n<p>Bacterial endocarditis is rare in children and is usually associated with underlying congenital heart disease, rheumatic heart disease, or central venous catheter use. Gram-positive organisms are most common (<strong>Staphylococcus aureus and Viridans group Streptococci</strong>). <strong>Blood cultures should be obtained to establish diagnosis</strong> and guide antibiotic therapy.</p>\n<p>Broad-spectrum antibiotics are necessary but should begin <em>after</em> cultures are obtained.</p>\n<div class=\"meta\">Subject: <span>Internal Medicine</span> | System: <span>Cardiovascular</span> | Topic: <span>Cardiac Infections</span></div>\n"}, {"id": "f3_19", "title": "Electrocardiogram / AVNRT", "stem": "<p>A 23-year-old man comes to the emergency department 45 minutes after the sudden onset of palpitations and mild shortness of breath that began while he was drinking beer with friends. He has not had chest pain or loss of consciousness. He has no history of serious illness and takes no medications. On arrival, he appears anxious. He is alert and fully oriented. His pulse is 138/min and regular, and blood pressure is 100/65 mm Hg; other vital signs are within normal limits. Pulse oximetry on room air shows an oxygen saturation of 99%. The patient's tachycardia ends abruptly during the examination. The remainder of the examination shows no abnormalities. Which of the following is the most likely diagnosis?</p>", "options": [["A", "Atrial fibrillation"], ["B", "Atrioventricular nodal reentrant tachycardia"], ["C", "Multifocal atrial tachycardia"], ["D", "Sinus tachycardia"], ["E", "Ventricular tachycardia"], ["F", "Wandering atrial pacemaker"]], "correct": "B", "explanation": "\n<span class=\"answer-tag\">Correct: B — AVNRT</span>\n<h4>Educational Objective</h4>\n<p><strong>AVNRT is the most common type of supraventricular tachycardia that occurs in structurally normal hearts</strong> and is often provoked by alcohol, caffeine, exertion, stress, or sympathomimetic medications. It is characterized by a <strong>regular rhythm with abrupt onset and termination</strong>.</p>\n<p>Sinus tachycardia has gradual onset/decrease. VT is associated with structural heart disease. Atrial fibrillation is irregularly irregular.</p>\n<div class=\"meta\">Subject: <span>Internal Medicine</span> | System: <span>Cardiovascular</span> | Topic: <span>Electrocardiogram</span></div>\n"}, {"id": "f3_20", "title": "HOCM", "stem": "<p>A previously healthy 32-year-old man comes to the office because of a 6-month history of palpitations, fatigue, and shortness of breath on exertion. He also has had occasional chest pain after eating large meals. He appears healthy and is not in acute distress. His pulse is 88/min, respirations are 12/min, and blood pressure is 138/86 mm Hg. Carotid pulses are forceful. Cardiac examination shows a left ventricular lift. An S4 gallop and grade 3/6, harsh, systolic crescendo-decrescendo murmur are heard best at the lower left sternal border and apex. Results of Valsalva maneuver and ECG are shown. Which of the following is the most likely diagnosis?</p>", "options": [["A", "Aortic sclerosis"], ["B", "Aortic stenosis"], ["C", "Hypertrophic obstructive cardiomyopathy"], ["D", "Mitral regurgitation"], ["E", "Mitral stenosis"]], "correct": "C", "explanation": "\n<span class=\"answer-tag\">Correct: C — Hypertrophic obstructive cardiomyopathy</span>\n<h4>Educational Objective</h4>\n<p>HOCM results from a thickened and stiff left ventricle, leading to <strong>outflow tract obstruction and diastolic dysfunction</strong>. Maneuvers that <strong>decrease preload or increase afterload</strong> (such as the Valsalva maneuver) accentuate the murmur as a result of increased incursion of the interventricular septum into the LV outflow tract.</p>\n<p>Aortic stenosis murmur decreases with Valsalva. MR is holosystolic at the apex radiating to the axilla. MS is a diastolic rumble.</p>\n<div class=\"meta\">Subject: <span>Internal Medicine</span> | System: <span>Cardiovascular</span> | Topic: <span>Electrocardiogram</span></div>\n", "image": "data:image/png;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCALQAp4DASIAAhEBAxEB/8QAHQAAAQQDAQEAAAAAAAAAAAAAAAIDBQYBBAcICf/EAFkQAAEDAQQGBAgJBwoEBAcBAQEAAgMEBREhMQYSEyJBUQcyYZEUIzNCUnGxwQgVcoGSk6HR8BYXU1Vio7IkNjdDVGNzdKLhJTQ1dRiCg8ImREWz0uLxJ2T/xAAXAQEBAQEAAAAAAAAAAAAAAAAAAQID/8QAHhEBAQEAAwEBAQEBAAAAAAAAAAERITFBAhJhcVH/2gAMAwEAAhEDEQA/APVKEIQCEIQCFo2xa9n2LSeFWrVw0lOXBm0ldcLzkFtwysmiZJE4PY9oc1wyIORQLQhCAQhCAQhVrTvTWxtB7Ljr7fmfFTvkEbdRusST2ILKhcps3p90Dr62KmbaUsLpDqh00Ra2/wBa6nFIyWNskbg5jgHNcDgQeKBaELnukvS3o1o/pOLAqH1M9oC7XbTxF4jvyvuQdCQsNIc0OGRF6ygEIQgEIVYsLTexra0mtOwKOV/xnZwvnje264dh45oLOhVfTbTmxNDfAm2zO9stZJsoIo26znn1KzRP2kbX3EBwvuOaBSFX9NtLrJ0Ms t x-ray with dedicated rib views"]], "correct": "A", "explanation": "\n<span class=\"answer-tag\">Correct: A — CT angiography of the chest</span>\n<h4>Educational Objective</h4>\n<p><strong>Traumatic dissection of the aorta</strong> can occur in sudden deceleration injuries, presenting with chest pain and hemodynamic instability. Chest x-ray can show <strong>a widened mediastinum</strong>, whereas <strong>CT angiography of the chest is the gold standard</strong> for diagnosis.</p>\n<p>Pericardiocentesis is for tamponade (distant heart sounds, pulsus paradoxus). Needle thoracostomy is for tension pneumothorax.</p>\n<div class=\"meta\">Subject: <span>Internal Medicine</span> | System: <span>Cardiovascular</span> | Topic: <span>Aortic and peripheral artery diseases</span></div>\n", "image": "data:image/png;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAIsAp0DASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAABAECAwUGBwAI/8QASRAAAQQBAwIFAgQDBgQDBgUFAQACAxEEBRIhMUEGEyJRYTJxBxRCgSNSkRUzYqGxwiRywdFTg5MWFyVjc5I0NUNUgkWjsuHw/8QAGAEBAQEBAQAAAAAAAAAAAAAAAQACAwT/xAAkEQEBAQACAgMAAwEBAQEAAAAAAREhMQJBElFhIjJxQgMTFP/aAAwDAQACEQMRAD8A+YRK73SiR3umFePCNyo/zHe695jvdMSWq1JPMd7r3mO91EXgJjnm+DwnpJ/Md7/5JP lCysc3lzeFYWVBK4uhNp1YDaf6pD1BRAjbY4THsAr7pvCRtI9l6rS1wlZ1CfGZQTleAXiUp6I8uw8x1fZPvjdXKi7BI1xBR3GjmvJBSs+tIF49SmzgFIaXUvUAOErfp/dKOv7os4N6MtRzN3MNp7uf6pD3VbwIrXNo7QP3Xq3EG+fZTyNFlQOJEnCJ0SyWLscKINbVgIo+tp3Id3BWt3gULPCJRzwhXtH08cIuXqfsgsjhza9lnynxIKZos7bUcZMbrLuV7Ie4BoBQM0jru+U5wlnEXveeTSNkeH4rTfI6ofF4haR1pOi9UEwPuqd4lZrIEmOx/wDKaXMfFLwZ3+w4XTdQ/wDy+UfK5VrriXPv3VaKwWs3bvZYrUq3H2W31rq77LE6kOf2WZzymf1AU13srHUGgeEMIg36jaA1H+7ciMhx/wDZWEdt631TVCOqJhFAoYdUVH0KzWa//9k="}, {"id": "f3_22", "title": "Congenital Heart Disease", "stem": "<p>A 3-month-old boy is brought to the physician for evaluation of delayed growth. He was born at term following an uncomplicated pregnancy and delivery. There was no cyanosis at birth. His mother says that he feeds poorly and turns blue around the lips and fingers during feedings. He frequently cries and becomes restless, short of breath, and cyanotic. He is at the 20th percentile for length and 10th percentile for weight. During the examination, he has paroxysms of crying during which he becomes cyanotic; his color is normal at rest. A grade 3/6, systolic ejection murmur is heard at the left sternal border. Which of the following is the most likely diagnosis?</p>", "options": [["A", "Aortic stenosis"], ["B", "Atrial septal defect"], ["C", "Coarctation of the aorta"], ["D", "Patent ductus arteriosus"], ["E", "Tetralogy of Fallot"], ["F", "Transposition of the great arteries"], ["G", "Truncus arteriosus"], ["H", "Ventricular septal defect"]], "correct": "E", "explanation": "\n<span class=\"answer-tag\">Correct: E — Tetralogy of Fallot</span>\n<h4>Educational Objective</h4>\n<p>Tetralogy of Fallot consists of <strong>pulmonary infundibular stenosis, overriding aorta, VSD, and right ventricular hypertrophy</strong>, resulting in a right-to-left shunt with cyanosis. <strong>Paroxysmal cyanosis during periods of crying (\"tet\" spells)</strong> is classic. Treatment is surgical correction within the first 6 months of life.</p>\n<p>The murmur of TOF is typically a holosystolic murmur best heard at the LLSB caused by RVOT obstruction.</p>\n<div class=\"meta\">Subject: <span>Pediatrics</span> | System: <span>Cardiovascular</span> | Topic: <span>Congenital Heart Disease</span></div>\n"}, {"id": "80", "title": "Preoperative Angina Equivalent Evaluation", "stem": "A 63-year-old woman comes to the office for evaluation before ventral hernia repair. She has a 3-month history of increasingly severe abdominal cramps and low back pain that are worse at night, plus heartburn that typically occurs after she pushes her grandson on a swing. She avoids most physical activity because of these symptoms. She has type 2 diabetes mellitus treated with metformin. Fifteen years ago, she underwent total abdominal hysterectomy. She smoked one pack per day for 8 years but quit 35 years ago. She is 160 cm (5 ft 3 in) tall, weighs 72 kg (160 lb), and has BMI 28 kg/m². Vital signs and cardiopulmonary examination are normal. There is truncal obesity and a 10 × 10-cm easily reducible mass under the midline scar. Which of the following is the most appropriate next step in management?", "options": {"A": "Cardiac stress scintigraphy", "B": "Pulmonary function testing", "C": "Recommendation for a low-sodium, low-fat diet", "D": "Recommendation to wear an abdominal binder", "E": "Switching from metformin to insulin"}, "correct": "A", "explanation": "This patient has a possible exertional anginal equivalent rather than simple reflux. Diabetes can blunt classic chest pain, and her symptoms limit exertion, indicating poor functional capacity before elective surgery. The most appropriate next step is noninvasive cardiac ischemia testing with stress imaging because the result could change perioperative management. Pulmonary testing is not indicated without pulmonary findings; diet advice alone does not address the immediate perioperative cardiac concern; an abdominal binder does not evaluate operative risk; and switching metformin to insulin is not the key next step here."}, {"id": "81", "title": "Rheumatic Mitral Valve Disease", "stem": "A 32-year-old man comes to the physician because of a 6-month history of shortness of breath with exertion, palpitations, and generalized swelling. His pulse is 105/min and irregular, and blood pressure is 118/70 mm Hg. A grade 3/6 holosystolic murmur and a diastolic rumble are heard at the apex. An ECG shows atrial fibrillation and right ventricular hypertrophy. Which of the following is the most likely cause of these findings?", "options": {"A": "Calcification of a bicuspid aortic valve", "B": "Calcification of a tricuspid aortic valve", "C": "Congenital defect of the atrial septum", "D": "Congenital defect of the ventricular septum", "E": "Infection of cardiac valves with Staphylococcus aureus", "F": "Infection of cardiac valves with viridans streptococcus", "G": "Inflammation of the endocardium and myocardium", "H": "Inflammation of the pericardium", "I": "Rheumatic mitral valve disease"}, "correct": "I", "explanation": "Rheumatic mitral valve disease can lead to mitral stenosis, classically producing an opening snap followed by a diastolic rumble loudest at the apex. Long-standing rheumatic disease can also cause left atrial enlargement and atrial fibrillation, pulmonary hypertension, and eventual right ventricular hypertrophy. The combination of apical rumble, atrial fibrillation, and signs of right-sided failure strongly supports rheumatic mitral valve pathology."}, {"id": "82", "title": "Aortic Dissection in Marfan Syndrome", "stem": "A 37-year-old man is brought to the emergency department 45 minutes after the sudden onset of severe, sharp pain in his back and chest while he was playing basketball. He rates his pain as an 8 on a 10-point scale. After playing for 2 hours, he had the onset of pain and then had loss of consciousness for 45 seconds. He has Marfan syndrome and long-standing gastroesophageal reflux disease treated with a proton pump inhibitor. On arrival, he is alert and oriented. He is 198 cm (6 ft 6 in) tall and weighs 77 kg (170 lb); BMI is 20 kg/m². His temperature is 37.8°C (100°F), pulse is 120/min, respirations are 26/min, and blood pressure is 95/65 mm Hg. Examination shows dry mucous membranes. Breath sounds are distant at the left lung base. There is dullness to percussion on the left. Fluid resuscitation is begun. Which of the following is the most appropriate next step in management?", "options": {"A": "Measurement of cardiac enzyme activities", "B": "CT scan of the chest", "C": "Ventilation-perfusion lung scans", "D": "Oral rehydration therapy", "E": "Esophageal manometry", "F": "Placement of a chest tube on the left"}, "correct": "B", "explanation": "Aortic dissection is a life-threatening emergency and is diagnosed with CT angiography of the chest. This patient has classic tearing chest and back pain plus Marfan syndrome, which markedly raises the risk of dissection. Distant breath sounds and dullness to percussion on the left likely reflect pleural effusion or hemothorax secondary to the dissection, but diagnosis of the aortic catastrophe should not be delayed."}, {"id": "83", "title": "Hypertensive Cardiovascular Disease", "stem": "A 42-year-old woman comes to the physician because she had a 2-hour episode of shortness of breath yesterday after walking for two blocks. She has not had chest pain and has no previous history of shortness of breath with exertion or at night. She has a 6-year history of poorly controlled hypertension. Her current medications are a diuretic, β-adrenergic blocking agent, and calcium-channel blocking agent. There is no family history of coronary artery disease. She does not smoke. Her pulse is 85/min and irregularly irregular, respirations are 16/min, and blood pressure is 170/90 mm Hg. The lungs are clear to auscultation. On cardiac examination, S1 and S2 are normal. No murmurs are heard. Serum studies show a total cholesterol concentration of 130 mg/dL and LDL-cholesterol concentration of 90 mg/dL. An ECG shows atrial fibrillation and left ventricular hypertrophy. Which of the following is the most appropriate next step in diagnosis?", "options": {"A": "Cardiac catheterization with coronary angiography", "B": "Cardiac stress scintigraphy", "C": "ECG exercise stress test", "D": "Echocardiography", "E": "24-hour ambulatory ECG monitoring", "F": "Tilt test"}, "correct": "D", "explanation": "Poorly controlled hypertension commonly causes left ventricular hypertrophy and can progress to heart failure with preserved or reduced ejection fraction. Echocardiography is the gold standard next test to assess cardiac structure and function in suspected heart failure. Ambulatory monitoring is unnecessary because atrial fibrillation is already present on ECG, and stress testing or catheterization is not the best first diagnostic step for this presentation."}, {"id": "84", "title": "Hypertrophic Obstructive Cardiomyopathy", "stem": "A 25-year-old man comes to the office for a routine health maintenance examination. He has no history of serious illness and takes no medications. He has smoked one pack of cigarettes daily for 7 years. His blood pressure is 150/88 mm Hg. A grade 3/6, harsh, midsystolic, crescendo-decrescendo murmur is heard best at the upper left sternal border with radiation to the neck. The murmur is louder with Valsalva maneuver. The point of maximal impulse is at the anterior axillary line in the fifth intercostal space. An ECG is shown. Which of the following is the most likely cause of this patient’s murmur?", "options": {"A": "Atrial septal defect", "B": "Bicuspid aortic valve", "C": "Hypertrophic obstructive cardiomyopathy", "D": "Mitral prolapse", "E": "Mitral regurgitation"}, "correct": "C", "explanation": "In hypertrophic cardiomyopathy, the left ventricle becomes thickened and stiff, producing dynamic left ventricular outflow tract obstruction and diastolic dysfunction. Maneuvers that decrease preload, such as Valsalva, intensify the murmur because the septum and anterior mitral leaflet move closer together, worsening obstruction. This is the classic physiology behind hypertrophic obstructive cardiomyopathy.", "image": "data:image/png;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAGMAp4DASIAAhEBAxEB/8QAHAAAAgMBAQEBAAAAAAAAAAAAAwYCBAUBAAcI/8QAUBAAAQIDBAcEBgcHAwQABQMFAQIDAAQRBRMhUQYSIiMxMkEUQmFxM0NSU5HRBySBkpOhsRU0YnKCwfAWouEXRFRzJjaD0uIlJ7I1RcLx8v/EABYBAQEBAAAAAAAAAAAAAAAAAAABAv/EABsRAQADAQEBAQAAAAAAAAAAAAABESFBMWEC/9oADAMBAAIRAxEAPwD9Tk4Hj8DAlfvA48p6HOOKS9Q71P4Z+cCWh0zA208p9Wc/ONQLRIx4/dMCluVeJ5j0McUh013ifwz84HLpe1V7xPMfVn5wrEFnPQL48MjnBa8eP3TFSaQ8WV1cT+Gc/ODFDtDvE/hn5w4PH9768mRzgmFDx+6YrKQ92qt4mup7s5+cE1Hsd4jw3Z+cB6V9F14noc47McW+POOhgMsl6750jE+rOfnHXkPVb3ieYerPzi9OLXx6dDAWv3l7jwT0ORjoS97aenqz84C0l7tD28T3fVnI+MRVpfIvjwyOURY9CjjwHQwNaHtVW8Tw92cvOIsIeuUbxPAerPzhwEeG21x5h0OUGqPH4GKjqHdZveJ4j1Zy84NqvU9Kn8M/OEiLPpnePd6HKCOHcq48uRyiu2l69d3ienqzl5xNxD10veJ5fdnLzhPqQIxS5b48o6HKIPnes8eJ6HKIMJdukbxPKPVnLzjjyXrxo3iaf+s5ecK04s1FKY0/lMDZOy5x5j0Mc1HqekTX/wBZ+cCYS7qubxPMfVn5wBpz92c4/A5wZRwPH4GKc2Huzubafwzn5wYpeINXU/hn5wV0/vI48h6HOCE8eP3TFXVe7UNtPIfVnPzgpS9jvU/hn5woelsArjxPQ5x2a9Crj8DnApdL2qreJ4n1Zz845NJeuV Vx/c0UUAfyldF/krj+5o/lK6L/JXH9zRRQB/KV0X+SuP7mj+Urov8lcf3NFFAH8pXRf5K4/uaP5Sui/yVx/c0UUAfyldF/krj+5o/lK6L/JXH9zRRQB/KV0X+SuP7mj+Urov8lcf3NFFAH8pXRf5K4/uaP5Sui/yVx/c0UUAfyldF/krj+5o/lK6L/JXH9zRRQH/2Q=="}, {"id": "86", "title": "Viral Myocarditis in a Child", "stem": "A previously healthy 1-year-old boy is brought to the emergency department because of difficulty breathing for 12 hours. Over the past 2 days, he has had a cough and clear nasal discharge. His temperature is 36.5°C (97.7°F), pulse is 180/min, respirations are 60/min, and blood pressure is 70/46 mm Hg. He appears extremely anxious and apprehensive. Examination shows cool, pale, and mottled extremities. Pulses are thready. Scattered wheezes and bilateral basilar crackles are heard on auscultation of the chest; there is a gallop with no murmur. The liver is tender and palpated 6 cm below the right costal margin. Capillary blood gas analysis while breathing supplemental oxygen shows the values below. An x-ray of the chest shows mild cardiomegaly and hilar infiltrates. Which of the following is the most likely diagnosis?", "options": {"A": "Bronchiolitis", "B": "Dehydration", "C": "Hepatitis", "D": "Myocarditis", "E": "Pneumonia"}, "correct": "D", "explanation": "Viral myocarditis can present in children with shock and signs of heart failure, including tachycardia, hepatomegaly, pulmonary edema, crackles, and an S3 gallop. The chest x-ray showing cardiomegaly and pulmonary congestion, along with metabolic acidosis from poor perfusion, fits myocarditis far better than primary bronchiolitis or pneumonia."}, {"id": "87", "title": "Heart Failure Neurohormonal Response", "stem": "An 82-year-old woman with hypertension comes to the office because of a 2-month history of easy fatigability and shortness of breath with mild exertion. She says she has to use two pillows to sleep and breathe comfortably. She had a myocardial infarction at age 75 years. Her medications are hydrochlorothiazide, fosinopril, and potassium supplementation. She has never smoked. Her pulse is 100/min, and blood pressure is 150/100 mm Hg. Crackles are heard at the lung bases bilaterally. There is pitting edema of the lower extremities. Which of the following is the most likely set of findings in this patient?", "options": {"A": "Decreased sympathetic tone / Decreased renal blood flow / Increased urine sodium concentration", "B": "Decreased sympathetic tone / Increased renal blood flow / Increased urine sodium concentration", "C": "Increased sympathetic tone / Decreased renal blood flow / Decreased urine sodium concentration", "D": "Increased sympathetic tone / Decreased renal blood flow / Increased urine sodium concentration", "E": "Increased sympathetic tone / Increased renal blood flow / Decreased urine sodium concentration"}, "correct": "C", "explanation": "Heart failure reduces effective arterial blood volume and renal perfusion. The kidney senses this as decreased renal blood flow, activating the renin-angiotensin-aldosterone system and sympathetic nervous system. The net effect is increased sympathetic tone and increased sodium and water reabsorption, which lowers urine sodium concentration."}, {"id": "88", "title": "Persistent Essential Hypertension", "stem": "A 47-year-old woman comes to the office for a follow-up evaluation of blood pressure control. At two previous visits during the past 3 months, her blood pressure was 154/94 mm Hg and 160/96 mm Hg, respectively. During the past 3 months, she has been following a low-sodium diet and a regimen of exercise and has limited her alcohol intake. She is 165 cm (5 ft 5 in) tall and weighs 60 kg (132 lb); BMI is 22 kg/m². Today, her blood pressure is 152/96 mm Hg. Physical examination shows no other abnormalities. ECG and laboratory studies show no abnormalities. In addition to advising the patient to continue her diet and exercise program and monitor her blood pressure at home, which of the following is the most appropriate next step in management?", "options": {"A": "Prescribe an α-adrenergic blocking agent", "B": "Prescribe a β-adrenergic blocking agent", "C": "Prescribe a thiazide diuretic", "D": "No additional monitoring or treatment now; reevaluate in 2 months"}, "correct": "C", "explanation": "This patient has persistent hypertension despite an adequate trial of lifestyle modification. First-line pharmacologic therapy for uncomplicated essential hypertension includes thiazide diuretics, calcium channel blockers, ACE inhibitors, and ARBs. Thiazides are appropriate here; α-blockers and β-blockers are not preferred first-line choices without another specific indication."}, {"id": "89", "title": "Atrial Fibrillation", "stem": "A previously healthy 47-year-old man is brought to the emergency department 45 minutes after the sudden onset of generalized weakness and “fluttering” in his chest. His symptoms began as he was working in a coffee shop. On arrival, he is pale, anxious, and diaphoretic. His pulse is 150/min and irregular, respirations are 22/min, and blood pressure is 100/60 mm Hg. The lungs are clear to auscultation. Cardiac examination discloses irregular tachycardia. The remainder of the examination shows no abnormalities. ECG is shown. Which of the following is the most likely cause of these findings?", "options": {"A": "Atrial fibrillation", "B": "Atrioventricular block", "C": "Junctional tachycardia", "D": "Sinus tachycardia", "E": "Ventricular tachycardia"}, "correct": "A", "explanation": "The ECG shows disorganized atrial activity with an irregularly irregular rhythm and narrow QRS complexes, which is classic for atrial fibrillation with rapid ventricular response. AV block produces conduction delays or dropped beats, junctional and sinus tachycardia are regular narrow-complex rhythms, and ventricular tachycardia is usually a regular wide-complex tachycardia.", "image": "data:image/png;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAA ations are omeprazole and ibuprofen. There is no family history of premature coronary artery disease. The patient has smoked one pack of cigarettes daily for 25 years. Vital signs are within normal limits. Cardiac examination shows no abnormalities. Serum troponin I concentration is within the reference range. ECG now shows no abnormalities. Which of the following is the most likely diagnosis?", "options": {"A": "Catecholamine-induced cardiomyopathy", "B": "Gastroesophageal reflux disease", "C": "Musculoskeletal chest pain", "D": "Myocardial infarction", "E": "Variant angina pectoris"}, "correct": "E", "explanation": "Variant (Prinzmetal) angina is caused by transient coronary vasospasm. It typically produces episodic chest pain at rest, often at night, with transient ST-segment elevation during attacks and a normal ECG between episodes. Smoking and migraine history both support vasospastic disease, and normal troponin plus previously normal angiography argue against myocardial infarction from fixed coronary obstruction."}];
    let index = 0;
    const state = Object.fromEntries(questions.map(q => [q.id, { selected: null, submitted: false }]));

    const chipsEl = document.getElementById('chips');
    const qBadge = document.getElementById('qBadge');
    const titleEl = document.getElementById('title');
    const stemEl = document.getElementById('stem');
    const optionsEl = document.getElementById('options');
    const explanationEl = document.getElementById('explanation');
    const feedbackEl = document.getElementById('feedback');
    const heroEl = document.getElementById('hero');
    const submitBtn = document.getElementById('submitBtn');
    const resetBtn = document.getElementById('resetBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function renderChips() {
      chipsEl.innerHTML = '';
      questions.forEach((q, i) => {
        const btn = document.createElement('button');
        btn.className = 'chip' + (i === index ? ' active' : '');
        btn.textContent = String(i + 1);
        btn.onclick = () => { index = i; render(); };
        chipsEl.appendChild(btn);
      });
    }

    function render() {
      const q = questions[index];
      const s = state[q.id];
      qBadge.textContent = 'Q ' + String(index + 1);
      titleEl.textContent = q.title;
      stemEl.innerHTML = q.stem;
      heroEl.innerHTML = q.image ? `<div class="image-wrap"><img src="${q.image}" alt="Medical image for question ${index + 1}"></div>` : '';
      optionsEl.innerHTML = '';

      q.options.forEach(([letter, text]) => {
        const btn = document.createElement('button');
        btn.className = 'option';
        if (s.selected === letter) btn.classList.add('selected');
        if (s.submitted && letter === q.correct) btn.classList.add('correct');
        if (s.submitted && s.selected === letter && letter !== q.correct) btn.classList.add('wrong');
        btn.innerHTML = `<div class="letter">${letter}</div><div><strong>${letter}.</strong> ${text}</div>`;
        btn.onclick = () => {
          if (s.submitted) return;
          s.selected = letter;
          render();
        };
        optionsEl.appendChild(btn);
      });

      if (s.submitted) {
        const ok = s.selected === q.correct;
        feedbackEl.className = 'feedback show ' + (ok ? 'ok' : 'no');
        feedbackEl.innerHTML = ok
          ? `✅ Correct. Answer: <strong>${q.correct}</strong>`
          : `❌ Incorrect. Your answer: <strong>${s.selected ?? '—'}</strong> &nbsp;|&nbsp; Correct answer: <strong>${q.correct}</strong>`;
        explanationEl.className = 'explanation show';
        explanationEl.innerHTML = q.explanation;
      } else {
        feedbackEl.className = 'feedback';
        feedbackEl.innerHTML = '';
        explanationEl.className = 'explanation';
        explanationEl.innerHTML = '';
      }

      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === questions.length - 1;
      renderChips();
    }

    submitBtn.onclick = () => {
      const q = questions[index];
      const s = state[q.id];
      if (!s.selected) {
        feedbackEl.className = 'feedback show no';
        feedbackEl.innerHTML = 'Please choose an option first.';
        return;
      }
      s.submitted = true;
      render();
    };

    resetBtn.onclick = () => {
      const q = questions[index];
      state[q.id] = { selected: null, submitted: false };
      render();
    };

    prevBtn.onclick = () => { if (index > 0) { index -= 1; render(); } };
    nextBtn.onclick = () => { if (index < questions.length - 1) { index += 1; render(); } };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextBtn.click();
      if (e.key === 'ArrowLeft') prevBtn.click();
    });

    render();
  </script>
