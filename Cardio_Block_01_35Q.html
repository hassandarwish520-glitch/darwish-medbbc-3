<!DOCTYPE html>
<html lang='en' dir='ltr'>
<head>
  <meta charset='UTF-8' />
  <meta name='viewport' content='width=device-width, initial-scale=1.0' />
  <title>Cardio_Block_01_35Q.html</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #121922;
      --panel-2: #171f2b;
      --text: #e8eef7;
      --muted: #97a6ba;
      --border: #283241;
      --accent: #3b82f6;
      --green: #17803d;
      --green-2: #0f5d2b;
      --red: #8b1e2b;
      --yellow: #fff06a;
      --yellow-text: #1e1b00;
      --shadow: 0 12px 32px rgba(0,0,0,.28);
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, Arial, sans-serif; background: radial-gradient(circle at top, #17202d 0%, var(--bg) 38%); color: var(--text); }
    a { color: inherit; }
    .app { min-height:100vh; display:grid; grid-template-columns: 320px 1fr; }
    .sidebar { background: rgba(10,14,20,.88); border-right:1px solid var(--border); padding: 22px 18px; position: sticky; top:0; height:100vh; overflow:auto; }
    .brand { font-size: 1.25rem; font-weight: 800; margin-bottom: 6px; }
    .sub { color: var(--muted); font-size: .93rem; line-height:1.5; }
    .chips { display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
    .chip { border:1px solid var(--border); background: var(--panel); color: var(--text); border-radius:14px; padding:10px 12px; cursor:pointer; font-weight:700; min-width:54px; text-align:center; }
    .chip.active { background: linear-gradient(180deg,#264163,#1c3150); border-color:#426793; }
    .summary { margin-top:20px; padding:14px; border:1px solid var(--border); background: var(--panel); border-radius:18px; color:var(--muted); font-size:.92rem; line-height:1.6; }
    .main { padding: 24px; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
    .toolbar-left, .toolbar-right { display:flex; align-items:center; gap:10px; }
    .q-badge { background: #161f2c; border:1px solid #334154; min-width:72px; text-align:center; padding:12px 14px; border-radius:16px; font-weight:800; box-shadow: var(--shadow); }
    .icon-btn { background: #131a25; border:1px solid var(--border); color: var(--text); width:46px; height:46px; border-radius:14px; cursor:pointer; font-size:1.1rem; }
    .card { max-width: 980px; margin:0 auto; background: rgba(14,20,29,.92); border:1px solid var(--border); border-radius: 28px; overflow:hidden; box-shadow: var(--shadow); }
    .hero { padding:24px 24px 0; }
    .image-wrap { border-radius: 22px; overflow:hidden; border:1px solid var(--border); background:#fff; }
    .hero img { width:100%; display:block; max-height:430px; object-fit:contain; background:#fff; }
    .content { padding: 26px; }
    .eyebrow { color:#7fb1ff; font-size:.84rem; letter-spacing:.08em; text-transform:uppercase; font-weight:800; }
    h1 { margin:10px 0 8px; font-size:1.65rem; line-height:1.25; }
    .stem { color:var(--text); line-height:1.76; font-size:1rem; }
    .stem p, .stem ul, .stem table { margin: 0 0 16px; }
    .stem ul { padding-left: 22px; }
    table { width:100%; border-collapse: collapse; overflow:hidden; border-radius:16px; border:1px solid var(--border); background:#10161f; }
    th, td { padding:12px 14px; border:1px solid var(--border); text-align:left; }
    th { background:#182231; }
    .options { display:grid; gap:14px; margin-top:22px; }
    .option { width:100%; text-align:left; display:flex; gap:14px; align-items:flex-start; border:1px solid #304056; background: linear-gradient(180deg,#1a2230,#151c27); color:var(--text); border-radius:22px; padding:18px 18px; cursor:pointer; transition:.18s ease; }
    .option:hover { transform: translateY(-1px); border-color:#4e6787; }
    .option .letter { width:30px; height:30px; border-radius:999px; border:2px solid #cfd7e4; display:grid; place-items:center; flex:0 0 auto; margin-top:1px; font-weight:800; font-size:.92rem; }
    .option.selected { border-color:#5b8bd6; box-shadow: inset 0 0 0 1px #5b8bd6; }
    .option.correct { background: linear-gradient(180deg,#218545,#156d36); border-color:#4ed37e; }
    .option.correct .letter { border-color:#b9ffd0; }
    .option.wrong { background: linear-gradient(180deg,#70212e,#5a1621); border-color:#d06d7d; }
    .option.wrong .letter { border-color:#ffd0d6; }
    .controls { display:flex; flex-wrap:wrap; gap:12px; margin-top:22px; }
    .primary, .secondary { border:none; border-radius:16px; padding:14px 18px; font-weight:800; cursor:pointer; }
    .primary { background:#3566d6; color:white; }
    .secondary { background:#1a2230; color:var(--text); border:1px solid var(--border); }
    .feedback { margin-top:18px; padding:14px 16px; border-radius:18px; font-weight:800; display:none; }
    .feedback.show { display:block; }
    .feedback.ok { background: rgba(23,128,61,.18); border:1px solid rgba(78,211,126,.4); color:#bff3d0; }
    .feedback.no { background: rgba(139,30,43,.18); border:1px solid rgba(208,109,125,.4); color:#ffd7de; }
    .explanation { display:none; margin-top:22px; padding:22px; background:#10161f; border:1px solid var(--border); border-radius:22px; line-height:1.75; }
    .explanation.show { display:block; }
    .objective { margin-top:16px; background: var(--yellow); color: var(--yellow-text); padding:14px 16px; border-radius:16px; font-weight:700; }
    .footer-note { margin-top:18px; color:var(--muted); font-size:.9rem; }
    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { position:static; height:auto; }
      .main { padding: 14px; }
      .content { padding:20px; }
      h1 { font-size:1.35rem; }
    }
  </style>

ion shows mild tenderness to palpation of the chest wall.</p>\n<table>\n  <tr><th>Lab</th><th>Value</th></tr>\n  <tr><td>Na<sup>+</sup></td><td>143 mEq/L</td></tr>\n  <tr><td>K<sup>+</sup></td><td>4.3 mEq/L</td></tr>\n  <tr><td>Cl<sup>−</sup></td><td>102 mEq/L</td></tr>\n  <tr><td>HCO<sub>3</sub><sup>−</sup></td><td>28 mEq/L</td></tr>\n  <tr><td>Urea nitrogen</td><td>18 mg/dL</td></tr>\n  <tr><td>Creatinine</td><td>1.2 mg/dL</td></tr>\n  <tr><td>Creatine kinase</td><td>87 U/L</td></tr>\n  <tr><td>Troponin I</td><td>0.1 ng/mL (normal ≤ 0.04)</td></tr>\n</table>\n<p>An ECG shows normal sinus rhythm and 1- to 2-mm ST-segment depression in leads V3 through V5.</p>\n<p><strong>Question:</strong> Which of the following is the most likely explanation for these findings?</p>\n", "options": [["A", "Acute coronary syndrome"], ["B", "Acute muscular strain"], ["C", "Esophageal spasm"], ["D", "Panic attack"], ["E", "Pericarditis"]], "correct": "A", "explanation": "\n<p>Although the patient has some chest wall tenderness, the combination of ischemic ECG changes and elevated troponin is most consistent with acute coronary syndrome rather than a musculoskeletal or psychiatric cause.</p>\n<p>Panic attacks can cause intense anxiety, but ECG and troponin would be normal. Pericarditis typically causes sharp positional chest pain with diffuse ST-segment elevation and PR depression; troponin is usually not elevated unless myocardium is involved.</p>\n<div class='objective'><strong>Educational Objective:</strong> Acute coronary syndrome includes unstable angina, NSTEMI, and STEMI. It classically presents with acute chest pain and may include dyspnea, nausea, or light-headedness. Troponin concentration and ECG should be obtained early in the evaluation of ACS.</div>\n"}, {"id": "31", "title": "Carotid Artery Dissection", "stem": "\n<p>A 42-year-old woman is brought to the emergency department 30 minutes after the sudden onset of left-sided weakness and a moderate headache while exercising at the gym. The weakness occurred almost immediately after sudden pain in her right jaw that radiated to the right temple. She has no history of serious illness and takes no medications.</p>\n<p>Temperature 37°C (98.6°F), pulse 90/min, blood pressure 150/90 mm Hg.</p>\n<ul>\n  <li>Left homonymous hemianopia</li>\n  <li>Right pupil 2 mm, left pupil 4 mm; both reactive to light</li>\n  <li>Partial ptosis of the right eye</li>\n  <li>Drooping of the left lower face</li>\n  <li>Strength 5/5 in right extremities and 4/5 in left extremities</li>\n  <li>Reflexes 2+ on right and 3+ on left</li>\n  <li>Babinski absent on right, present on left</li>\n</ul>\n<p><strong>Question:</strong> Which of the following is the most likely diagnosis?</p>\n", "options": [["A", "Cardioembolic stroke"], ["B", "Carotid artery dissection"], ["C", "Hypertensive hemorrhage"], ["D", "Subarachnoid hemorrhage"], ["E", "Vertebrobasilar infarct"]], "correct": "B", "explanation": "\n<p>Subarachnoid hemorrhage classically causes a severe “worst headache of life,” often with meningismus or depressed consciousness. Vertebrobasilar infarction causes posterior circulation findings such as vertigo, disequilibrium, ataxia, and nystagmus, which are absent here.</p>\n<div class='objective'><strong>Educational Objective:</strong> Carotid artery dissection is often precipitated by a minor traumatic or mechanical event such as exercise or vigorous coughing. Patients can present with headache, jaw or face pain, partial Horner syndrome, and focal neurologic deficits. Diagnosis is made with CT or MR angiography.</div>\n"}, {"id": "32", "title": "Advance Directive / DNAR and Asystole", "stem": "\n<p>A 91-year-old man is brought to the emergency department by his wife because he collapsed at home after the onset of a headache. He has chronic obstructive pulmonary disease and claudication in his lower extremities. Current medications include metoprolol and an albuterol inhaler. He has an advance directive stating that he does not want heroic, life-prolonging measures. He is intubated and mechanically ventilated. He is unresponsive to painful stimuli. Approximately 10 minutes after arrival, the cardiac monitor shows asystole.</p>\n<p><strong>Question:</strong> Which of the following is the most appropriate next step in management?</p>\n", "options": [["A", "Inform the patient's wife that he has died"], ["B", "Administer epinephrine"], ["C", "Administer morphine"], ["D", "Begin chest compressions"], ["E", "Begin defibrillation"]], "correct": "A", "explanation": "\n<p>Asystole is an unshockable rhythm. In addition, this patient has a directive against heroic life-prolonging interventions, and the scenario indicates brain death / futile resuscitation.</p>\n<p>Morphine may be used for terminal pain, but it is not helpful in brain death. Defibrillation and CPR are not appropriate here.</p>\n<div class='objective'><strong>Educational Objective:</strong> CPR can be attempted in cardiopulmonary arrest when the patient is not brain dead and does not have a DNAR order. Patients who show evidence of brain death or possess a DNAR order should not receive CPR and should be declared dead.</div>\n"}, {"id": "33", "title": "Low ASCVD Risk Dyslipidemia Management", "stem": "\n<p>A 47-year-old man comes for a routine health maintenance examination. He reports no health problems. He has no history of serious illness, takes no medications, does not smoke or drink alcohol, and has a sedentary lifestyle. There is no family history of coronary artery disease. He is 178 cm (5 ft 10 in) tall and weighs 79 kg (175 lb); BMI is 25 kg/m<sup>2</sup>. Temperature 36.5°C (97.7°F), pulse 76/min, respirations 10/min, blood pressure 120/70 mm Hg. Examination shows no abnormalities.</p>\n<table>\n  <tr><th>Lipid Study</th><th>Value</th></tr>\n  <tr><td>Total cholesterol</td><td>200 mg/dL</td></tr>\n  <tr><td>HDL-cholesterol</td><td>28 mg/dL</td></tr>\n  <tr><td>LDL-cholesterol</td><td>137 mg/dL</td></tr>\n  <tr><td>Triglycerides</td><td>175 mg/dL</td></tr>\n</table>\n<p><strong>Question:</strong> Which of the following is the most appropriate next step in management?</p>\n", "options": [["A", "Recommending a low-sodium diet"], ["B", "Recommending an exercise program"], ["C", "Bile acid sequestrant therapy"], ["D", "HMG-CoA reductase inhibitor therapy"], ["E", "Nicotinic acid therapy"]], "correct": "B", "explanation": "\n<p>This patient has LDL &lt; 190 mg/dL and an ASCVD risk of 4.4%, so medication is not indicated at this time. Statin therapy would be indicated for LDL &ge; 190 mg/dL or sufficiently elevated cardiovascular risk.</p>\n<div class='objective'><strong>Educational Objective:</strong> Cardiovascular risk can be decreased by lifestyle modification and treatment of risk factors such as obesity, tobacco use, diabetes, hypertension, and hyperlipidemia. Patients with very low 10-year risk should undergo routine screening and follow-up rather than immediate drug therapy.</div>\n"}, {"id": "34", "title": "Postoperative Acute Myocardial Infarction", "stem": "\n<p>Six hours after uncomplicated carotid endarterectomy, a 77-year-old man with hypertension reports left shoulder pain and difficulty breathing. He was admitted to the hospital 1 year ago for congestive heart failure. Temperature 37°C (98.6°F), pulse 90/min and irregular, respirations 18/min, blood pressure 100/70 mm Hg, oxygen saturation 92% on 2 L/min by nasal cannula. The surgical site is clean, dry, and intact. Crackles are heard at the left lung base. Heart sounds are normal. An ECG is shown.</p>\n<p><strong>Question:</strong> Which of the following is the most likely diagnosis?</p>\n", "options": [["A", "Acute myocardial infarction"], ["B", "Congestive heart failure"], ["C", "Dissecting aortic aneurysm"], ["D", "Pulmonary embolism"], ["E", "Spontaneous pneumothorax"]], "correct": "A", "explanation": "\n<p>Pulmonary embolism usually presents with dyspnea, tachypnea, tachycardia, and pleuritic chest pain; the ECG is more suggestive of ischemia. Spontaneous pneumothorax would not explain ischemic ST-segment changes.</p>\n<div class='objective'><strong>Educational Objective:</strong> Acute coronary syndrome classically presents with substernal pressure that may radiate to the neck, jaw, or arm and may be accompanied by dyspnea, nausea, or diaphoresis. ECG may show ST elevation, ST depression, T-wave inversion, or even be initially unrevealing.</div>\n", "image": "data:image/png;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAHQApgDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAwQCBQYBAAf/xABQEAABAgMFBgUACAMEBwYGAgMBAgMABFEREyExQQUSFCNCUgYiMjNhJDRDU3GRkqFiorEVgbLBByVUY3LR8BZEgpOj4Rc1VXPC8SYnRTaD/8QAFwEBAQEBAAAAAAAAAAAAAAAAAAECA//EACIRAQEBAQEAAgMBAAMBAAAAAAABESFBEjECIlFhMnGBQv/aAAwDAQACEQMRAD8A++zHgvwyGnSnYezsEn7AUjrPgvwyWkE7D2dbuj7AUi6mX1Fl3kuek9PxHWHlXCOS56R0/EdO4ihmvBfhsPMgbD2cAT9wKQUeCvDX/wBD2cf/APgItZp5V8zyXM+34gt8q32XP0xbuRGfl/Bfhopdt2Hs42OKAtYFY7OeC/DKJZwp2Hs4EEZMCoi5lnlbr3Jc9xXT8x2feVwznJczHT8iJl08VavBXhgW/wCo9nf+QKwFXgvw1xln9ibPs3ThcCsaEvKx5Ln6RWAKeVxg5LnoPT8wmirV4K8M2KH9h7O/8gVgEt4L8NKbcJ2Hs42KObArGiU+qw8lz9IrAJR5V25yXPUrp+YdxVJO+C/DSZZwp2Hs4EWZMDuEMK8E+GrD/qPZ3/kCsWU88rhXOS5p0/ SP6G4V/kLqX5jP8UKX9IfovI6H1Cv6xiD2mNmAApuh224LxJn6RHRzx0TqAr/xGIn8onpH9B6/8xipXtkRqw5Qlb6vqvE/5RPSHC29E6gP/cYoN/SK6OP/ALJ1D+2xCvbvLcey0YbPwrxN36RXSmmv8i68/wDrYoH9IrpJ56Jr/wAxilK9lnh5oJfy75peQO/SH6Sb/wBSa+/6xiXP6QPSrx0bXfmMRLj190Vk0UCRpBN5Xk3+f/pIOOi67+2xAl+3vpLmEjo2uB/42IV6H1FhdMQEFkG2r5XmH+evpzpC49K1n9tqk77bOlk46Tra/rGoPR9Q3P1VVqI7BXCzfbN01/HStYP/AHGpOb7X+nOBb/kzV/2moOo6jHggrmtVBbnEKo1v2o6CYGun6of+pqrH/aBoyT/oWo/tBBYdRj8uFxPsvH+qQGTqEzvdxXe9T8Z6WeB7GaSZpIuyQuEk1TXSvcWnJtRCjNObw1HZpzXFojdUwfuFE/XYv/xu/igCNNjhSbAGlE/XYv8A8blh10ZN+W5BHyQXYQtezZpZcdkwzWxA/duUOoapkumexjCD7lBzKxH/AFc7b3Ba8h3uFVr/2Q=="}, {"id": "37", "title": "Hypertrophic Obstructive Cardiomyopathy", "stem": "\n<p>An 18-year-old basketball player is brought to the emergency department 1 hour after collapsing during a game. He was successfully resuscitated at the scene. On arrival, he is awake and alert. Temperature 37.1°C (98.8°F), pulse 80/min and regular, respirations 12/min, blood pressure 120/80 mm Hg. Examination shows no abnormalities. ECG shows left ventricular hypertrophy. Echocardiography shows systolic anterior motion of the anterior mitral leaflet causing subaortic obstruction.</p>\n<p><strong>Question:</strong> Which of the following is the most appropriate next step in management?</p>\n", "options": [["A", "β-Adrenergic blocking agent therapy"], ["B", "Placement of a permanent ventricular pacemaker"], ["C", "Aortic valve replacement"], ["D", "Mitral valve anuloplasty"], ["E", "Surgical excision of the endocardium of the left ventricular free wall"]], "correct": "A", "explanation": "\n<p>Surgical excision of the left ventricular free wall endocardium is not useful because the pathology is septal myocardial hypertrophy. Refractory cases may require septal myomectomy.</p>\n<div class='objective'><strong>Educational Objective:</strong> In hypertrophic obstructive cardiomyopathy, outflow tract obstruction and/or arrhythmia can cause exertional syncope or sudden cardiac death. Therapy that improves diastolic filling by slowing the heart rate—such as β-blockers or non-dihydropyridine calcium-channel blockers—is first line.</div>\n"}, {"id": "38", "title": "Peripheral Arterial Disease and Postoperative MI Risk", "stem": "\n<p>A previously healthy 57-year-old man comes to the physician because of a 2-month history of increasing left foot pain at rest. He has smoked two packs of cigarettes daily for 30 years. Left popliteal and pedal pulses cannot be palpated. The foot is cool, and dependent rubor is noted. Arteriography shows occlusion of the left superficial femoral artery and stenosis of the left profunda femoris artery. Arterial bypass graft is scheduled.</p>\n<p><strong>Question:</strong> The patient is at greatest risk for development of which of the following postoperative complications?</p>\n", "options": [["A", "Cerebral infarction"], ["B", "Ischemic colitis"], ["C", "Myocardial infarction"], ["D", "Pneumonia"], ["E", "Renal failure"]], "correct": "C", "explanation": "\n<p>Renal failure can occur after vascular bypass because of baseline kidney disease, perioperative hypotension, and contrast exposure, but in this patient the greatest postoperative risk comes from underlying systemic atherosclerotic cardiovascular disease and the hemodynamic stress of surgery.</p>\n<div class='objective'><strong>Educational Objective:</strong> Peripheral arterial disease presents with limb pain on exertion or at rest, diminished pulses, and rubor. Complications of bypass surgery include myocardial infarction, stroke, renal failure, and pneumonia; myocardial infarction risk is increased because of coexisting atherosclerotic cardiovascular disease and postoperative cardiac stress.</div>\n"}, {"id": "40", "title": "Acute Thoracic Aortic Dissection", "stem": "\n<p>A 72-year-old man is brought to the emergency department 30 minutes after the sudden onset of severe chest pain radiating to his back. He underwent CABG 10 years ago after a prior myocardial infarction and has had intermittent substernal chest pain since. He has hypertension and is not always compliant with medication. Current medications include a nitrate, a calcium-channel blocker, and a β-blocker. He appears anxious and diaphoretic and cannot find a comfortable position. Temperature 37.9°C (100.2°F), pulse 65/min and regular, respirations 30/min, blood pressure 190/110 mm Hg in the right arm and 110/80 mm Hg in the left arm. Lungs are clear. CT chest shows opacification of half of the aortic lumen from just proximal to the origin of the left subclavian artery to the celiac artery, with thrombus in the false lumen and a left pleural effusion.</p>\n<p><strong>Question:</strong> Which of the following is the most appropriate next step in management?</p>\n", "options": [["A", "Nitroprusside therapy"], ["B", "Intravenous bolus of tissue plasminogen activator"], ["C", "Placement of a left chest tube"], ["D", "Coronary angiography"], ["E", "Pericardiocentesis"], ["F", "Thoracentesis"]], "correct": "A", "explanation": "\n<p>Coronary angiography is used when acute coronary syndrome is the main concern, but this patient already has CT evidence of acute aortic dissection. Pericardiocentesis would be appropriate only if tamponade from proximal rupture were present.</p>\n<div class='objective'><strong>Educational Objective:</strong> Thoracic aortic dissection may present with chest pain, back pain, hypertension, pulse deficit, or aortic regurgitation. Immediate medical management includes aggressive blood pressure and heart rate control using agents such as esmolol and nitroprusside.</div>\n"}, {"id": "1", "title": "Pre-Exercise Clearance in an Asymptomatic Young Adult", "stem": "\n<p>A 25-year-old man comes for an examination before starting an exercise program consisting of swimming four times weekly. He feels well but wants to change his sedentary lifestyle. He has smoked one-half pack of cigarettes daily for 9 years. His father had a myocardial infarction at age 52. He is 178 cm (5 ft 10 in) tall and weighs 109 kg (240 lb); BMI is 34 kg/m<sup>2</sup>. Pulse 76/min, blood pressure 138/76 mm Hg. The remainder of the examination and ECG show no abnormalities.</p>\n<p>In addition to obtaining serum lipid studies and recommending smoking cessation, which of the following is the most appropriate next step in management?</p>\n", "options": [["A", "Approval of the exercise program"], ["B", "Exercise stress test"], ["C", "Echocardiography"], ["D", "24-Hour ambulatory ECG monitoring"], ["E", "Cardiac catheterization"]], "correct": "A", "explanation": "\n<p>Stress testing is recommended for patients with angina, prior ACS with changing symptoms, or selected structural heart disease—not for this asymptomatic young adult. Echocardiography, ambulatory monitoring, and catheterization would be unnecessary in the absence of symptoms or abnormal findings.</p>\n<div class='objective'><strong>Educational Objective:</strong> Lifestyle modification with increased physical activity, diet optimization, weight management, and treatment of modifiable risk factors such as tobacco use and hyperlipidemia is appropriate in asymptomatic patients beginning exercise.</div>\n"}, {"id": "2", "title": "Claudication and AAA Screening", "stem": "\n<p>A 67-year-old man is brought to the emergency department because of a 6-week history of moderate pain in his legs when walking. The pain begins after he walks approximately 50 feet, improves if he stops, and returns when he walks again. It is worse in the right leg. He has hypertension and hyperlipidemia. Current medications are lisinopril, amlodipine, metoprolol, and atorvastatin. He has smoked two packs of cigarettes daily for 40 years. He is 180 cm (5 ft 11 in) tall and weighs 107 kg (235 lb); BMI is 33 kg/m<sup>2</sup>. Blood pressure is 150/86 mm Hg. Examination shows sparse hair from 6 cm above the foot to the dorsum of the foot bilaterally. Lower-extremity pulses are 1+.</p>\n<p><strong>Question:</strong> At this time, it is most appropriate to evaluate this patient for which of the following conditions?</p>\n", "options": [["A", "Abdominal aortic aneurysm"], ["B", "Carotid artery stenosis"], ["C", "Deep venous thrombosis"], ["D", "Peripheral neuropathy"], ["E", "Venous insufficiency"]], "correct": "A", "explanation": "\n<p>The leg symptoms are vascular rather than neurogenic. Venous insufficiency would typically cause edema, hyperpigmentation, and varicosities rather than classic intermittent claudication. DVT would present more acutely with swelling and pain.</p>\n<div class='objective'><strong>Educational Objective:</strong> The USPSTF recommends screening for abdominal aortic aneurysm in men aged 65–75 years who have a history of tobacco use.</div>\n"}, {"id": "4", "title": "Aortic Valve Insufficiency", "stem": "\n<p>An asymptomatic 47-year-old woman comes for a routine health maintenance examination. She has no history of rheumatic fever and takes no medications. Pulse 70/min, blood pressure 150/60 mm Hg. A grade 2/6 decrescendo murmur that begins after S2 is heard at the left sternal border.</p>\n<p><strong>Question:</strong> Which of the following is the most likely diagnosis?</p>\n", "options": [["A", "Aortic valve insufficiency"], ["B", "Aortic valve stenosis"], ["C", "Mitral valve regurgitation"], ["D", "Mitral valve stenosis"], ["E", "Tricuspid valve regurgitation"]], "correct": "A", "explanation": "\n<p>Mitral stenosis produces an opening snap and diastolic rumble at the apex. Tricuspid regurgitation is a holosystolic murmur at the left lower sternal border.</p>\n<div class='objective'><strong>Educational Objective:</strong> Aortic insufficiency is due to an incompetent aortic valve, causing retrograde flow from the aorta into the left ventricle during diastole. The classic murmur is an early diastolic decrescendo murmur.</div>\n"}, {"id": "6", "title": "Stable Angina Evaluation", "stem": "\n<p>A 55-year-old man comes to the office because of a 3-month history of mild, intermittent, mid chest pain. Episodes occur 3 days weekly, last 2–3 minutes, have not increased in severity, and are relieved by rest and antacids. He has hypertension and asthma. Current medications are lisinopril, hydrochlorothiazide, and albuterol. He does not smoke and drinks four glasses of wine on weekends. He works as an automobile mechanic. Pulse 78/min, respirations 16/min, blood pressure 142/84 mm Hg, oxygen saturation 97% on room air. Cardiorespiratory examination is normal. ECG shows normal sinus rhythm with no ST-T wave changes.</p>\n<p><strong>Question:</strong> Which of the following is the most appropriate next step in diagnosis?</p>\n", "options": [["A", "Cardiac catheterization"], ["B", "Exercise stress test"], ["C", "Quantitative coronary artery calcium scoring"], ["D", "Rest-redistribution thallium scan"], ["E", "No further testing is indicated"]], "correct": "B", "explanation": "\n<p>Coronary calcium scoring is used for cardiovascular risk assessment in asymptomatic patients, not as the best next test in someone with anginal symptoms. Thallium viability studies are used in known CAD to assess viable myocardium.</p>\n<div class='objective'><strong>Educational Objective:</strong> Chest pain that improves with rest is suggestive of angina pectoris due to myocardial ischemia from narrowed coronary arteries. An exercise stress test is an appropriate initial diagnostic test when the patient can exercise and has an interpretable ECG.</div>\n"}, {"id": "5", "title": "Initial HFrEF Pharmacotherapy", "stem": "\n<p>A 63-year-old woman comes to the emergency department because of a 1-week history of progressive shortness of breath on exertion and swelling of her legs. She has been using two pillows to sleep. Pulse 100/min, respirations 24/min, blood pressure 120/80 mm Hg, oxygen saturation 93% on room air. There is jugular venous distention, bilateral basilar crackles, a grade 3/6 holosystolic murmur at the apex, an S3 gallop, and 3+ pitting edema of the lower extremities. Echocardiography shows an ejection fraction of 30%.</p>\n<p><strong>Question:</strong> In addition to furosemide, which of the following is the most appropriate pharmacotherapy at this time?</p>\n", "options": [["A", "Hydralazine"], ["B", "Lisinopril"], ["C", "Metoprolol"], ["D", "Nifedipine"], ["E", "Spironolactone"]], "correct": "B", "explanation": "\n<p>Guideline-directed initial therapy for heart failure with reduced ejection fraction includes a diuretic for symptom relief plus a renin-angiotensin-aldosterone system inhibitor. Beta-blockers are then added once the patient is hemodynamically stabilized and euvolemic. Nifedipine is not used for this purpose.</p>\n<div class='objective'><strong>Educational Objective:</strong> Initial therapy for HFrEF is a combination of a β-blocker, a renin-angiotensin-aldosterone system inhibitor, and a diuretic to reduce symptoms, preserve ventricular function, and reduce mortality.</div>\n"}, {"id": "7", "title": "Symptomatic Severe Aortic Stenosis", "stem": "\n<p>A 68-year-old woman comes to the physician because of a 6-month history of exertional shortness of breath and a pressure sensation in the mid chest. Initially symptoms occurred after climbing two flights of stairs and resolved with rest; over the last 4 months they occur after one flight. She has not had pain at rest, at night, or after eating. She has no major past medical history and does not smoke. Cardiac examination shows a grade 3/6 systolic ejection murmur heard best at the base of the heart with radiation to the carotids and an S4. Lipid studies: total cholesterol 217 mg/dL, HDL 59 mg/dL, LDL 140 mg/dL, triglycerides 90 mg/dL. ECG shows nonspecific ST-T-wave changes. Echocardiography shows ejection fraction 45% and severe aortic stenosis.</p>\n<p><strong>Question:</strong> Which of the following is the most appropriate next step in management?</p>\n", "options": [["A", "Afterload and preload reduction"], ["B", "Afterload reduction only"], ["C", "Balloon valvotomy"], ["D", "Preload reduction only"], ["E", "Valve replacement"]], "correct": "E", "explanation": "\n<p>Balloon valvotomy is generally reserved as a bridge or for patients who are not candidates for definitive replacement. Symptomatic severe AS with reduced EF requires definitive intervention.</p>\n<div class='objective'><strong>Educational Objective:</strong> Patients with severe aortic stenosis who have symptoms or evidence of systolic dysfunction (ejection fraction &lt; 50%) should undergo aortic valve replacement.</div>\n"}, {"id": "8", "title": "Immediate Evaluation of Chest Pain after Trauma", "stem": "\n<p>A 48-year-old man, hospitalized 3 days earlier after a motor vehicle collision, suddenly develops left-sided substernal chest pain. On admission, a right chest tube was placed for hemopneumothorax and multiple right rib fractures. He also sustained a right femur fracture repaired 2 days ago and a grade II liver laceration treated nonoperatively. Current vital signs: temperature 37.2°C (99.0°F), pulse 120/min and irregularly irregular, respirations 26/min, blood pressure 90/50 mm Hg, oxygen saturation 100% on room air. He appears anxious and is breathing laboriously. Breath sounds are mildly diminished on the right but there are no wheezes or crackles. Abdominal examination is normal.</p>\n<p><strong>Question:</strong> Which of the following is the most appropriate immediate next step in evaluation?</p>\n", "options": [["A", "Chest x-ray"], ["B", "Complete blood count"], ["C", "Duplex ultrasonography of the lower extremities"], ["D", "ECG"], ["E", "Echocardiography"]], "correct": "D", "explanation": "\n<p>Even though pulmonary embolism is a consideration in this trauma patient, the immediate evaluation of substernal chest pain with abnormal vital signs begins with ECG and cardiac biomarkers to quickly assess for acute myocardial infarction.</p>\n<div class='objective'><strong>Educational Objective:</strong> Immediate evaluation of a patient with substernal chest pain and vital-sign abnormalities includes focused history, examination, ECG, and cardiac biomarkers to rule out acute myocardial infarction.</div>\n"}, {"id": "9", "title": "Kussmaul Sign and Constrictive Pericarditis", "stem": "\n<p>A 76-year-old man comes to the physician because of a 5-week history of shortness of breath. He has no history of serious illness and takes no medications. Pulse 110/min, respirations 22/min, blood pressure 118/68 mm Hg, oxygen saturation 88% on room air. Examination shows jugular venous distention above the mandible bilaterally. The distention increases with inspiration.</p>\n<p><strong>Question:</strong> Which of the following is the most likely diagnosis?</p>\n", "options": [["A", "Acute myocardial infarction"], ["B", "Constrictive pericarditis"], ["C", "Left ventricular heart failure"], ["D", "Left ventricular heart failure and pulmonary edema"]], "correct": "B", "explanation": "\n<p>The key clue is <strong>Kussmaul sign</strong>: paradoxical rise in jugular venous pressure with inspiration. This finding reflects impaired right ventricular filling due to a rigid, noncompliant pericardium.</p>\n<div class='objective'><strong>Educational Objective:</strong> Constrictive pericarditis causes impaired diastolic filling from a fibrotic or calcified pericardium. Patients may present with elevated JVP, right-sided heart failure symptoms, and Kussmaul sign—an inspiratory increase in JVP.</div>\n"}, {"id": "18", "title": "Preoperative Angina Equivalent Evaluation", "stem": "\n<p>A 63-year-old woman comes to the office for evaluation before ventral hernia repair. She has a 3-month history of increasingly severe abdominal cramps and low back pain that are worse at night, plus heartburn that typically occurs after she pushes her grandson on a swing. She avoids most physical activity because of these symptoms. She has type 2 diabetes mellitus treated with metformin. Fifteen years ago, she underwent total abdominal hysterectomy. She smoked one pack per day for 8 years but quit 35 years ago. She is 160 cm (5 ft 3 in) tall, weighs 72 kg (160 lb), and has BMI 28 kg/m<sup>2</sup>. Vital signs and cardiopulmonary exam are normal. There is truncal obesity and a 10 × 10-cm easily reducible mass under the midline scar.</p>\n<p><strong>Question:</strong> Which of the following is the most appropriate next step in management?</p>\n", "options": [["A", "Cardiac stress scintigraphy"], ["B", "Pulmonary function testing"], ["C", "Recommendation for a low-sodium, low-fat diet"], ["D", "Recommendation to wear an abdominal binder"], ["E", "Switching from metformin to insulin"]], "correct": "A", "explanation": "\n<p>Diet counseling alone does not address the possibility that her exertional abdominal discomfort and “heartburn” represent angina equivalents. An abdominal binder will not treat coronary ischemia. Diabetes control matters, but changing metformin to insulin is not the next step here.</p>\n<div class='objective'><strong>Educational Objective:</strong> Patients with symptoms consistent with angina pectoris—or nonspecific symptoms worsened by exertion—should undergo stress testing. Patients able to exercise may undergo either an exercise treadmill stress test or exercise nuclear stress testing.</div>\n"}, {"id": "1", "title": "Cardiogenic shock after acute MI", "stem": "<p>A 55-year-old man is brought to the emergency department with shortness of breath and generalized weakness since yesterday. This morning he could not get out of bed. He has also had several episodes of midline chest pain but currently is chest pain free. Medical history includes hypertension, hyperlipidemia, type 2 diabetes mellitus, and peripheral vascular disease. The patient is an active smoker with a 20-pack-year history. He appears to be in respiratory distress, and his extremities are cold and clammy. Temperature is 37.5 C (99.5 F), blood pressure is 80/50 mm Hg, pulse is 120/min, and respirations are 30/min. There is visible jugular venous distension with the patient in a sitting position. Chest auscultation reveals bilateral crackles. The abdomen is soft and nontender. ECG shows sinus tachycardia with left bundle branch block. Initial laboratory results are below. Which of the following sets of parameters is most likely to be seen in this patient?</p>", "options": [["A", "A. ↑ left ventricular preload, ↑ cardiac output, ↓ systemic vascular resistance"], ["B", "B. ↑ left ventricular preload, ↓ cardiac output, ↑ systemic vascular resistance"], ["C", "C. ↓ left ventricular preload, ↓ cardiac output, ↑ systemic vascular resistance"], ["D", "D. ↓ left ventricular preload, ↑ cardiac output, ↓ systemic vascular resistance"], ["E", "E. ↓ left ventricular preload, ↓ cardiac output, ↓ systemic vascular resistance"]], "correct": "1", "explanation": "This presentation is classic for cardiogenic shock due to acute myocardial infarction: hypotension, JVD, pulmonary crackles, cold clammy extremities, and elevated lactate. Pump failure causes low forward flow, so cardiac output falls. Because the left ventricle cannot eject normally, left-sided filling pressure/preload rises. Compensatory vasoconstriction raises systemic vascular resistance."}, {"id": "2", "title": "Mitral stenosis causing cardioembolic stroke", "stem": "<p>A 37-year-old woman comes to the emergency department due to left-sided weakness that started several hours ago. She has had no fever, headache, or vision changes. Over the past 6 months, the patient has had progressive exertional dyspnea, nocturnal cough, and occasional hemoptysis. She also has had frequent episodes of palpitations and an irregular heartbeat. The patient emigrated from Cambodia 2 years ago. She has never used tobacco and does not use alcohol. On neurologic examination, left-sided hemiparesis is present. Which of the following is the most likely diagnosis?</p>", "options": [["A", "A. Aortic insufficiency"], ["B", "B. Hypertrophic cardiomyopathy"], ["C", "C. Mitral stenosis"], ["D", "D. Primary pulmonary hypertension"], ["E", "E. Wolff-Parkinson-White syndrome"]], "correct": "2", "explanation": "Progressive dyspnea, nocturnal cough, hemoptysis, palpitations with irregular rhythm, and embolic stroke strongly suggest rheumatic mitral stenosis complicated by atrial fibrillation and systemic embolization. Mitral stenosis increases left atrial pressure and size, predisposing to AF and left atrial thrombus."}, {"id": "3", "title": "Acute STEMI requiring immediate PCI", "stem": "<p>A 59-year-old man comes to the emergency department due to chest pain beginning 2 hours ago and profuse sweating 1 hour ago. He feels weak. Past medical history includes type 2 diabetes mellitus and hypercholesterolemia. The patient's medications include metformin, glipizide, and simvastatin. Blood pressure is 165/98 mm Hg in the right arm and 160/90 mm Hg in the left, pulse is 78/min, and oxygen saturation is 98% on room air. He appears mildly uncomfortable. Lungs are clear to auscultation. An ECG exhibit is present. Which of the following is the best next step in management of this patient?</p>", "options": [["A", "A. Aspirin, cardiac enzyme levels, and observation in the intensive care unit"], ["B", "B. Aspirin, heparin infusion, and admission to the telemetry floor"], ["C", "C. Aspirin and immediate cardiac catheterization"], ["D", "D. CT scan of the chest"], ["E", "E. Nonsteroidal anti-inflammatory drugs as needed for pain"]], "correct": "2", "explanation": "This is acute ST-segment elevation myocardial infarction within the reperfusion window. The next step is urgent reperfusion with primary PCI plus aspirin and standard ACS therapy. Do not delay for serial enzymes or unrelated imaging when the clinical picture and ECG already indicate STEMI."}, {"id": "4", "title": "Late complication of anterior MI: ventricular aneurysm", "stem": "<p>A 60-year-old man is brought to the emergency department due to 2 weeks of progressive exertional dyspnea and fatigue. He has difficulty falling asleep and can hardly walk to the bathroom without becoming short of breath. The patient has had no chest pain, syncope, cough, or extremity edema. Two months ago, he was hospitalized with an anterior wall myocardial infarction but was not revascularized due to late presentation. The patient was discharged home with aspirin, clopidogrel, metoprolol, lisinopril, and atorvastatin. Temperature is 36.6 C (97.9 F), blood pressure is 100/67 mm Hg, and pulse is 67/min and regular. Examination shows bilateral crackles in the lower lung fields. The apical impulse is displaced to the left. A faint systolic murmur is heard over the apex. ECG reveals normal sinus rhythm and deep Q waves in leads I, aVL, and V2-V5, with a 2-mm ST-segment elevation. The ECG tracings are unchanged compared to those at discharge 2 months ago. Which of the following is the most likely underlying cause of this patient’s symptoms?</p>", "options": [["A", "A. Acute pericarditis"], ["B", "B. Papillary muscle rupture"], ["C", "C. Pericardial effusion"], ["D", "D. Recurrent ischemia"], ["E", "E. Right ventricular infarction"], ["F", "F. Ventricular aneurysm"], ["G", "G. Ventricular free wall rupture"]], "correct": "5", "explanation": "Weeks to months after a transmural MI, persistent ST elevation with deep Q waves and progressive heart failure symptoms suggests left ventricular aneurysm. The aneurysmal segment causes ventricular remodeling, reduced contractile efficiency, and can lead to HF, arrhythmia, mural thrombus, and chronic ST elevation."}, {"id": "6", "title": "Exertional presyncope from severe aortic stenosis", "stem": "<p>A 73-year-old man is brought to the emergency department after repeat episodes of lightheadedness. Yesterday, the patient felt lightheaded while jogging and sat down on the curb to prevent a fall. A similar episode occurred 6 weeks ago when he felt lightheaded while climbing stairs. He has had some exertional shortness of breath associated with chest discomfort for the past few months but has had no headache, blurry vision, or chest pain. Medical history includes hypertension. The patient takes hydrochlorothiazide and low-dose aspirin daily. ECG shows normal sinus rhythm with left ventricular hypertrophy. Which of the following is most likely to diagnose this patient's condition?</p>", "options": [["A", "A. 24-hour electrocardiographic monitoring"], ["B", "B. Carotid Doppler study"], ["C", "C. Echocardiogram"], ["D", "D. Tilt table testing"], ["E", "E. Treadmill stress testing"]], "correct": "2", "explanation": "Exertional dyspnea, exertional presyncope, and LVH suggest severe aortic stenosis. Transthoracic echocardiography is the best test to confirm structural valve disease and assess severity. Stress testing should not be the first step when severe symptomatic AS is suspected."}, {"id": "7", "title": "Physical finding in severe aortic stenosis", "stem": "<p>A 67-year-old man comes to the emergency department after losing consciousness while shoveling snow near his house. He reports having had a similar episode a month ago while carrying heavy bags from the grocery store. The patient has reduced his physical activity level over the last year due to progressive exertional dyspnea and fatigue. He has had no chest pain, palpitations, cough, or lower extremity swelling. His other medical problems include type 2 diabetes mellitus and hypercholesterolemia. He is a lifetime nonsmoker. Which of the following physical examination findings is most likely in this patient?</p>", "options": [["A", "A. Blood pressure differential between upper and lower extremities"], ["B", "B. Late diastolic murmur at cardiac apex"], ["C", "C. Prominent capillary pulsations on fingertips"], ["D", "D. Systolic blood pressure drop >10 mm Hg with inspiration"], ["E", "E. Systolic blood pressure drop >20 mm Hg upon standing"], ["F", "F. Weak and slow-rising carotid pulse"]], "correct": "5", "explanation": "Exertional syncope, dyspnea, and fatigue indicate severe aortic stenosis. The classic pulse finding is pulsus parvus et tardus: a weak, delayed carotid upstroke due to fixed obstruction across the aortic valve."}, {"id": "9", "title": "Cause of symptomatic aortic stenosis in a younger adult", "stem": "<p>A 48-year-old man comes to the office due to progressive exertional dyspnea. It has become especially bothersome over the past 2 months. He now becomes short of breath after climbing one flight of stairs. He has no known medical problems. He is not taking any medications and does not use tobacco or alcohol. Chest examination reveals a harsh systolic murmur that is best heard at the right second intercostal space with radiation along the carotid arteries. An S4 is heard at the apex. Based on these findings, what is the most likely cause of this patient's symptoms?</p>", "options": [["A", "A. Hypertrophic cardiomyopathy"], ["B", "B. Myxomatous valve degeneration"], ["C", "C. Rheumatic heart disease"], ["D", "D. Bicuspid aortic valve"], ["E", "E. Senile calcific aortic stenosis"]], "correct": "3", "explanation": "The murmur pattern is classic for aortic stenosis. In a patient younger than 70, the most likely cause is a congenital bicuspid aortic valve rather than senile calcific degeneration."}, {"id": "10", "title": "Anterior STEMI with pulmonary edema", "stem": "<p>A 65-year-old man comes to the emergency department due to substernal chest pain, severe shortness of breath, and diaphoresis that began suddenly 40 minutes ago. The pain radiates to his left arm and does not remit with sublingual nitroglycerin. ECG shows 2-mm ST-segment elevations in the anterior leads. Oxygen saturation is 90% on 4 L/min oxygen by nasal cannula. An S3 is heard on cardiac examination. Basilar crackles extending halfway up the lung fields bilaterally are noted on auscultation. The patient is given aspirin, clopidogrel, and atorvastatin, and anticoagulation is started. The administration of which of the following is the best next step in management of this patient?</p>", "options": [["A", "A. Amlodipine"], ["B", "B. Digoxin"], ["C", "C. Furosemide"], ["D", "D. Metoprolol"], ["E", "E. Normal saline"], ["F", "F. Spironolactone"], ["G", "G. Verapamil"]], "correct": "2", "explanation": "This patient has acute MI complicated by acute decompensated heart failure with pulmonary edema. Loop diuretics such as furosemide reduce pulmonary congestion. Beta blockers and non-dihydropyridine calcium channel blockers can worsen decompensated HF in the acute setting, and saline would worsen edema."}, {"id": "11", "title": "Immediate goal that improves long-term STEMI prognosis", "stem": "<p>A 65-year-old man is brought to the emergency department due to chest discomfort and diaphoresis that began suddenly an hour ago while he was resting. He describes the discomfort as squeezing; it is associated with left arm numbness and nausea. The lungs are clear to auscultation. There is no jugular venous distension or pedal edema. An ECG exhibit is present. Immediate interventions aimed at achieving which of the following goals would most improve this patient’s long-term prognosis?</p>", "options": [["A", "A. Decrease cardiac afterload"], ["B", "B. Decrease myocardial contractility"], ["C", "C. Prevent ischemia-induced arrhythmias"], ["D", "D. Prevent reperfusion myocardial injury"], ["E", "E. Restore coronary blood flow"]], "correct": "4", "explanation": "In acute STEMI, the intervention with the greatest effect on long-term prognosis is rapid reperfusion of the occluded coronary artery, usually with PCI. This limits infarct size and reduces mortality."}, {"id": "12", "title": "Inferior MI with hypotension and clear lungs", "stem": "<p>A 68-year-old woman comes to the emergency department due to sudden-onset chest pain associated with 2 episodes of vomiting. Blood pressure is 80/50 mm Hg and examination shows diaphoresis and elevated jugular venous pressure. A lower left parasternal systolic murmur increases with inspiration. The lungs are clear to auscultation. ECG reveals ST-segment elevation in leads II, III, and aVF with reciprocal changes in I and aVL. Which of the following is the most likely cause of this patient’s hypotension?</p>", "options": [["A", "A. Decreased right ventricular contractility"], ["B", "B. Decreased systemic vascular resistance"], ["C", "C. Increased intrapericardial pressure"], ["D", "D. Left-to-right interventricular shunt"], ["E", "E. Right ventricular outflow obstruction"]], "correct": "0", "explanation": "Inferior MI with JVD, hypotension, clear lungs, nausea/vomiting, and bradycardia suggests right ventricular infarction. Ischemic RV dysfunction decreases RV contractility, so less blood reaches the LV and systemic output falls."}, {"id": "13", "title": "Mechanism of inferior/posterior MI pattern", "stem": "<p>A 60-year-old man comes to the emergency department with sudden onset of nausea, vomiting, diaphoresis, and chest pain. Blood pressure is 85/55 mm Hg and pulse is 50/min. Lungs are clear to auscultation. His electrocardiogram is shown in the exhibit. Which of the following is the most likely mechanism of this patient’s condition?</p>", "options": [["A", "A. Inflammation of the pericardium"], ["B", "B. Occlusion of the left anterior descending artery"], ["C", "C. Occlusion of the left circumflex artery"], ["D", "D. Occlusion of the left main coronary artery"], ["E", "E. Occlusion of the right coronary artery"]], "correct": "4", "explanation": "Inferior MI with associated bradycardia/hypotension is most often due to right coronary artery occlusion. RCA disease can produce inferior and posterior infarction and frequently affects the AV node."}, {"id": "15", "title": "Sudden collapse days after MI", "stem": "<p>A 45-year-old man was hospitalized 5 days ago due to an anterior wall myocardial infarction. No reperfusion therapy was performed due to late presentation. This morning he develops sudden-onset chest discomfort, becomes agitated and diaphoretic, then quickly becomes unresponsive. No pulse is palpable, and the cardiac monitor shows a junctional rhythm. Which of the following is the most likely diagnosis?</p>", "options": [["A", "A. Free wall rupture"], ["B", "B. Interventricular septum rupture"], ["C", "C. Papillary muscle rupture"], ["D", "D. Recurrent ischemia"], ["E", "E. Right ventricular infarction"], ["F", "F. Ventricular aneurysm"]], "correct": "0", "explanation": "Several days after a transmural MI, sudden hemodynamic collapse with pulseless electrical activity suggests left ventricular free wall rupture causing hemopericardium, tamponade, and electromechanical dissociation."}, {"id": "16", "title": "Echo finding in mitral stenosis", "stem": "<p>A 35-year-old woman is seen in the outpatient clinic due to palpitations. Over the past 6 months, she has noticed decreased exercise tolerance and episodes of her heart racing. On examination, there is an early diastolic sound followed by a middiastolic murmur. ECG is shown in the exhibit. Which of the following is the most likely finding on echocardiography?</p>", "options": [["A", "A. Atrial septal defect"], ["B", "B. Left atrial dilation"], ["C", "C. Left atrial mass attached to interatrial septum"], ["D", "D. Left ventricular dilation"], ["E", "E. Left ventricular hypertrophy"]], "correct": "1", "explanation": "An opening snap followed by a middiastolic rumble indicates mitral stenosis. Chronic elevation of left atrial pressure causes left atrial enlargement, often with atrial fibrillation."}, {"id": "17", "title": "Initial therapy for chest pain suspicious for ACS", "stem": "<p>A 36-year-old woman comes to the emergency department due to chest pain that started suddenly while she was shopping. She also has shortness of breath, palpitations, and diaphoresis. The pain is retrosternal and radiates to the left arm. She has several coronary risk factors. Which of the following is the most appropriate initial therapy for this patient?</p>", "options": [["A", "A. Acetaminophen"], ["B", "B. Aspirin"], ["C", "C. Heparin"], ["D", "D. Ibuprofen"], ["E", "E. Lorazepam"], ["F", "F. Oxycodone"]], "correct": "1", "explanation": "Until acute coronary syndrome is excluded, aspirin should be given promptly because early antiplatelet therapy reduces MI and mortality. Alternative explanations should not delay this first step when the history is concerning for ischemia."}, {"id": "18", "title": "Acute MR after inferior MI", "stem": "<p>A 53-year-old man comes to the emergency department due to squeezing chest pain that started 2 hours ago. He also has severe shortness of breath that is worse when lying down. Chest auscultation shows a grade III/VI early systolic murmur at the cardiac apex and bibasilar crackles in the lungs. ECG reveals ST-segment elevations in II, III, and aVF. Which of the following is most likely to be significantly increased in this patient?</p>", "options": [["A", "A. Left atrial compliance"], ["B", "B. Left atrial size"], ["C", "C. Left ventricular compliance"], ["D", "D. Left ventricular end-diastolic pressure"], ["E", "E. Systolic aortic flow"]], "correct": "3", "explanation": "Acute mitral regurgitation after MI causes abrupt elevation of left-sided filling pressures and pulmonary edema. There is no time for left atrial or left ventricular enlargement/compliance changes, but LVEDP rises significantly."}];
    let index = 0;
    const state = Object.fromEntries(questions.map(q => [q.id, { selected: null, submitted: false }]));

    const chipsEl = document.getElementById('chips');
    const qBadge = document.getElementById('qBadge');
    const titleEl = document.getElementById('title');
    const stemEl = document.getElementById('stem');
    const optionsEl = document.getElementById('options');
    const explanationEl = document.getElementById('explanation');
    const feedbackEl = document.getElementById('feedback');
    const heroEl = document.getElementById('hero');
    const submitBtn = document.getElementById('submitBtn');
    const resetBtn = document.getElementById('resetBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function renderChips() {
      chipsEl.innerHTML = '';
      questions.forEach((q, i) => {
        const btn = document.createElement('button');
        btn.className = 'chip' + (i === index ? ' active' : '');
        btn.textContent = String(i + 1);
        btn.onclick = () => { index = i; render(); };
        chipsEl.appendChild(btn);
      });
    }

    function render() {
      const q = questions[index];
      const s = state[q.id];
      qBadge.textContent = 'Q ' + String(index + 1);
      titleEl.textContent = q.title;
      stemEl.innerHTML = q.stem;
      heroEl.innerHTML = q.image ? `<div class="image-wrap"><img src="${q.image}" alt="Medical image for question ${index + 1}"></div>` : '';
      optionsEl.innerHTML = '';

      q.options.forEach(([letter, text]) => {
        const btn = document.createElement('button');
        btn.className = 'option';
        if (s.selected === letter) btn.classList.add('selected');
        if (s.submitted && letter === q.correct) btn.classList.add('correct');
        if (s.submitted && s.selected === letter && letter !== q.correct) btn.classList.add('wrong');
        btn.innerHTML = `<div class="letter">${letter}</div><div><strong>${letter}.</strong> ${text}</div>`;
        btn.onclick = () => {
          if (s.submitted) return;
          s.selected = letter;
          render();
        };
        optionsEl.appendChild(btn);
      });

      if (s.submitted) {
        const ok = s.selected === q.correct;
        feedbackEl.className = 'feedback show ' + (ok ? 'ok' : 'no');
        feedbackEl.innerHTML = ok
          ? `✅ Correct. Answer: <strong>${q.correct}</strong>`
          : `❌ Incorrect. Your answer: <strong>${s.selected ?? '—'}</strong> &nbsp;|&nbsp; Correct answer: <strong>${q.correct}</strong>`;
        explanationEl.className = 'explanation show';
        explanationEl.innerHTML = q.explanation;
      } else {
        feedbackEl.className = 'feedback';
        feedbackEl.innerHTML = '';
        explanationEl.className = 'explanation';
        explanationEl.innerHTML = '';
      }

      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === questions.length - 1;
      renderChips();
    }

    submitBtn.onclick = () => {
      const q = questions[index];
      const s = state[q.id];
      if (!s.selected) {
        feedbackEl.className = 'feedback show no';
        feedbackEl.innerHTML = 'Please choose an option first.';
        return;
      }
      s.submitted = true;
      render();
    };

    resetBtn.onclick = () => {
      const q = questions[index];
      state[q.id] = { selected: null, submitted: false };
      render();
    };

    prevBtn.onclick = () => { if (index > 0) { index -= 1; render(); } };
    nextBtn.onclick = () => { if (index < questions.length - 1) { index += 1; render(); } };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextBtn.click();
      if (e.key === 'ArrowLeft') prevBtn.click();
    });

    render();
  </script>
